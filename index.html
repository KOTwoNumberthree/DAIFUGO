<title>大富豪</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}

/* ---------- テーマ（CSS変数） ---------- */
body[data-theme=casino]{

  --card-face:linear-gradient(160deg,#fffdf7,#f0e4c6);--ink-r:#b5162f;--ink-b:#161616;
  --joker:linear-gradient(135deg,#f0cf6a,#7d3c97 50%,#2c6fb6);

}

  --table:repeating-linear-gradient(90deg,rgba(90,52,20,.18) 0 2px,transparent 2px 13px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 9px),linear-gradient(180deg,#2e4a33,#1d3322 55%,#0f1f14);

  --accent:#8fd16a;--accent2:#d8f29a;
  --btn-bg:linear-gradient(#9fd47a,#4f8a3a);--btn-fg:#0c1a0a;--btn-bd:#2c5a22;
  --card-face:linear-gradient(160deg,#eef5e4,#d7e6c4);--ink-r:#c2452f;--ink-b:#1d2a18;

}

.telop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:16px;background:rgba(0,0,0,.72);color:var(--accent2);font-size:26px;font-weight:700;letter-spacing:.08em;white-space:nowrap;z-index:60;pointer-events:none;animation:telop 1.5s ease forwards;text-shadow:0 0 12px var(--accent)}

/* 札の表面の質感（全ての札・テーマ共通） */

.hand .card:not(:last-child) .pp,.hand .card:not(:last-child) .panel,.fcards .card:not(:last-child) .pp,.fcards .card:not(:last-child) .panel{display:none}

.hand{display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;padding:20px 16px 12px 14px;min-height:124px;-webkit-overflow-scrolling:touch}

.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:6px 10px}

/* 6人以上：相手を1行の横スクロールにして、手札と操作ボタンの領域を確保 */

.opps.crowded .opp{flex:0 0 auto;width:112px;padding:4px 6px;scroll-snap-align:start}

.opps.crowded .ostack .card{width:20px;height:30px;margin-left:-11px}

.field-wrap{padding:4px 10px}
.field{position:relative;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:18px;background:rgba(0,0,0,.14);border:1px dashed rgba(255,255,255,.18)}
.fowner{font-size:12px;opacity:.9}
.fcards{display:flex;justify-content:center}
.fcards .card{margin-left:-14px}
.fcards .card:first-child{margin-left:0}
.fcards.fresh .card{animation:slideIn .42s ease-out both}
.fcards.fresh.multi .card{animation:fadeUp .46s ease-out both}
.fcards.fresh.multi .card:nth-child(2){animation-delay:.1s}
.fcards.fresh.multi .card:nth-child(3){animation-delay:.2s}
.fcards.fresh.multi .card:nth-child(4){animation-delay:.3s}
.fcards.fresh.multi .card:nth-child(n+5){animation-delay:.4s}
.field-ghost{position:absolute;left:8px;right:8px;top:8px;bottom:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;animation:fadeOut .9s ease-in forwards}
.flyer{position:fixed;z-index:66;pointer-events:none;margin:0}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeOut{to{opacity:0}}

.me{padding:4px 0 0}
.me-h{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;flex-wrap:wrap}
.actions{display:flex;gap:10px;padding:8px 12px 18px;margin-top:auto}

@keyframes slideIn{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes dealIn{from{transform:translateY(-120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
@keyframes telop{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .card,.fcards.fresh .card,.hand.deal .card,.opp.turn{animation:none!important}
  .flyer,.field-ghost{display:none!important}
  .telop{animation:none;opacity:1}
}

<body data-theme="casino">
<div id="app"></div>
<div id="overlay" class="overlay hidden"></div>
<div id="telop" class="telop hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =====================================================================
 * 0. 効果音（Web Audio API による乾いた紙質の卓上トランプ／花札音）
 * ===================================================================== */
const Sound = (() => {
  const KEY = 'daifugou_sound';
  let enabled = true;
  try {
    const saved = localStorage.getItem(KEY);
    if (saved === '0' || saved === 'false') enabled = false;
  } catch (e) {}

  let ctx = null;
  let frictionBufs = [];
  let snapBufs = [];
  let roomConv = null;
  let dryBus = null;
  let wetBus = null;
  let lastFricIdx = -1;
  let lastSnapIdx = -1;

  // テーマに応じた物理材質（低音を控えめにし、乾いた紙質を主体に設定）
  function getMaterial() {
    const theme = (typeof UI !== 'undefined' && UI.theme)
      ? UI.theme
      : (document.body && document.body.dataset.theme) || 'casino';

    if (theme.startsWith('wafu') || theme.startsWith('washi')) {
      // 花札（乾いた裏貼り厚紙）：硬質で歯切れの良い「パチッ！カサッ」
      return {
        isHanafuda: true,
        snapGain: 1.25,
        snapCenter: 2250,
        airFreq: 210,
        airGain: 0,
        fricGain: 0.75,
        fricCenter: 2900,
        tableModes: [
        ],
        knockModes: [
          [235, 0.20, 0.024],
          [510, 0.16, 0.015],
          [980, 0.09, 0.009],
        ],
      };
    }
    if (theme.startsWith('forest')) {
      // トランプ ＋ 木卓：乾いた紙擦れと軽やかな着地
      return {
        isHanafuda: false,
        snapGain: 1.0,
        snapCenter: 2700,
        airFreq: 190,
        airGain: 0.09,
        fricGain: 1.15,
        fricCenter: 3650,
        tableModes: [
          [175, 0.06, 0.018],
          [380, 0.05, 0.012],
        ],
        knockModes: [
          [215, 0.18, 0.024],
          [470, 0.14, 0.015],
          [910, 0.08, 0.009],
        ],
      };
    }
    // トランプ ＋ カジノ卓：エンボス紙の乾いた「ササッ・パチッ」
    return {
      isHanafuda: false,
      snapGain: 0.92,
      snapCenter: 2950,
      airFreq: 170,
      airGain: 0.10,
      fricGain: 1.28,
      fricCenter: 3950,
      tableModes: [
        [145, 0.05, 0.016],
        [310, 0.04, 0.011],
      ],
      knockModes: [
        [195, 0.16, 0.022],
        [430, 0.12, 0.014],
        [840, 0.06, 0.008],
      ],
    };
  }

  function pickBuf(list, isSnap) {
    if (!list.length) return null;
    let idx = Math.floor(Math.random() * list.length);
    const prev = isSnap ? lastSnapIdx : lastFricIdx;
    if (idx === prev && list.length > 1) idx = (idx + 1) % list.length;
    if (isSnap) lastSnapIdx = idx; else lastFricIdx = idx;
    return list[idx];
  }

  // 乾いた紙の表面・繊維が擦れる離散マイクログレイン波形（低域成分を徹底排除）
  function createDryPaperFrictionBuffer(ac, duration) {
    const sr = ac.sampleRate;
    const len = Math.floor(sr * duration);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);

    let prevWhite = 0;
    let stepCountdown = 0;
    let grainAmp = 0;

    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      // 1次微分ハイパスで低域の湿り気を消し、紙の乾いたカサカサ感だけを残す
      const crisp = (w - prevWhite) * 0.5;
      prevWhite = w;

      // 紙表面のエンボス粒が細かく弾ける離散パルス
      if (stepCountdown <= 0) {
        stepCountdown = Math.floor(2 + Math.random() * 9);
        grainAmp = (Math.random() < 0.42 ? 1.0 : 0.3) * (Math.random() * 2 - 1);
      } else {
        grainAmp *= 0.48;
        stepCountdown--;
      }

      d[i] = grainAmp * 0.72 + crisp * 0.68;
    }
    return buf;
  }

  // 乾いた紙・厚紙の角が弾ける超短インパルス波形（「パチッ」「ピシッ」）
  function createDryCardSnapBuffer(ac) {
    const sr = ac.sampleRate;
    const len = Math.floor(sr * 0.028);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);

    const reboundSample = Math.floor(sr * (0.0014 + Math.random() * 0.0022));
    const reboundPolarity = Math.random() < 0.5 ? -0.55 : 0.55;

    for (let i = 0; i < len; i++) {
      const t = i / sr;
      let v = 0;

      // 0.35ms以下の極めて鋭い乾いたトランジェント
      if (i < 12) {
        v += Math.sin((i / 12) * Math.PI) * (i % 2 === 0 ? 1.0 : -0.55);
      }
      // 紙端の微細な2次バウンド
      const dr = i - reboundSample;
      if (dr >= 0 && dr < 9) {
        v += reboundPolarity * Math.sin((dr / 9) * Math.PI);
      }
      // 紙繊維が弾ける高域の乾いた減衰尾
      if (i >= 6 && Math.random() < 0.24) {
        v += (Math.random() * 2 - 1) * 0.42 * Math.exp(-t * 380);
      }
      d[i] = v;
    }
    return buf;
  }

  // 極短のドライな卓上初期反射IR（65ms）
  function buildDryRoomIR(ac) {
    const sr = ac.sampleRate;
    const len = Math.floor(sr * 0.065);
    const ir = ac.createBuffer(1, len, sr);
    const d = ir.getChannelData(0);
    const taps = [
      [0.0028, 0.42],
      [0.0072, -0.28],
      [0.0135, 0.18],
      [0.0210, -0.10],
    ];
    for (const [sec, amp] of taps) {
      const idx = Math.floor(sec * sr);
      if (idx < len) d[idx] += amp;
    }
    let prev = 0;
    for (let i = Math.floor(0.005 * sr); i < len; i++) {
      const t = i / sr;
      const w = Math.random() * 2 - 1;
      const hi = (w - prev) * 0.5;
      prev = w;
      d[i] += hi * 0.14 * Math.exp(-t * 75);
    }
    return ir;
  }

  function ensure() {
    if (!enabled) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      ctx = new AC();

      dryBus = ctx.createGain();
      dryBus.gain.value = 0.96;
      dryBus.connect(ctx.destination);

      // 残響を最小限にして乾いた空気感を維持
      wetBus = ctx.createGain();
      wetBus.gain.value = 0.04;
      roomConv = ctx.createConvolver();
      roomConv.buffer = buildDryRoomIR(ctx);
      roomConv.connect(wetBus);
      wetBus.connect(ctx.destination);

      frictionBufs = Array.from({ length: 8 }, () => createDryPaperFrictionBuffer(ctx, 0.45));
      snapBufs = Array.from({ length: 8 }, () => createDryCardSnapBuffer(ctx));
    }
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  function routeOut(ac, node, panVal = 0) {
    if (ac.createStereoPanner) {
      const pan = ac.createStereoPanner();
      pan.pan.setValueAtTime(Math.max(-0.35, Math.min(0.35, panVal)), ac.currentTime);
      node.connect(pan);
      pan.connect(dryBus);
      pan.connect(roomConv);
    } else {
      node.connect(dryBus);
      node.connect(roomConv);
    }
  }

  // 1) 乾いた紙の摩擦音（1450Hz以下をカットし、カサッとした質感を強調）
  function emitFriction(ac, t, dur, centerFreq, gain, pan = 0) {
    const buf = pickBuf(frictionBufs, false);
    if (!buf) return;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.setValueAtTime(0.94 + Math.random() * 0.12, t);
    const offset = Math.random() * Math.max(0.01, buf.duration - dur - 0.02);

    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(1450, t);

    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(centerFreq, t);
    bp.Q.setValueAtTime(0.85, t);

    const g = ac.createGain();
    const atk = Math.min(0.007, dur * 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + atk);
    g.gain.setValueAtTime(gain * 0.82, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    routeOut(ac, g, pan);

    src.start(t, offset, dur + 0.01);
  }

  // 2) 乾いた紙の弾きクラック（「パチッ」「ピシッ」）
  function emitSnap(ac, t, centerFreq, gain, pan = 0) {
    const buf = pickBuf(snapBufs, true);
    if (!buf) return;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.setValueAtTime(0.93 + Math.random() * 0.14, t);

    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(1100, t);

    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(centerFreq, t);
    bp.Q.setValueAtTime(0.9, t);

    const g = ac.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.024);

    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    routeOut(ac, g, pan);

    src.start(t);
  }

  // 3) 極小の着地タッチ（低音を控えめにし、紙が面で触れる微かな気配のみ）
  function emitAirPocket(ac, t, freq, gain, pan = 0) {
    if (gain <= 0.005) return;
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t);

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.011);

    osc.connect(g);
    routeOut(ac, g, pan);

    osc.start(t);
    osc.stop(t + 0.013);
  }

  // 4) テーブル板の極小共振（叩きつける重みを抑えた軽い接触音）
  function emitTableModal(ac, t, modes, scale = 1.0, pan = 0) {
    if (scale <= 0.01) return;
    const jitter = 0.97 + Math.random() * 0.06;
    for (const [freq, amp, decay] of modes) {
      const osc = ac.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * jitter, t);

      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp * scale, t + 0.0015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

      osc.connect(g);
      routeOut(ac, g, pan);

      osc.start(t);
      osc.stop(t + decay + 0.004);
    }
  }

  // -------------------------------------------------------------------
  // 各アクションのフォーリー設計
  // -------------------------------------------------------------------

  // 手札を引く／戻す（指先で乾いた紙の角をずらす音）
  function select(up = true) {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const t = ac.currentTime;
    const j = 0.94 + Math.random() * 0.12;
    if (up) {
      emitFriction(ac, t, 0.022, mat.fricCenter * 1.05 * j, 0.16 * mat.fricGain, -0.04);
      emitSnap(ac, t + 0.007, mat.snapCenter * 1.15 * j, 0.13 * mat.snapGain, -0.04);
    } else {
      emitFriction(ac, t, 0.025, mat.fricCenter * 0.88 * j, 0.14 * mat.fricGain, 0.04);
    }
  }

  // 場に出す（低音を抑え、乾いた紙が重なり弾ける軽快な「サッ・パチッ！」）
  function play(count = 1) {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const n = Math.max(1, Math.min(count || 1, 6));
    const base = ac.currentTime;

    // 手札から抜き出す乾いた摩擦音
    emitFriction(ac, base, 0.024, mat.fricCenter * 0.95, 0.21 * mat.fricGain, 0);

    let cursor = base + (mat.isHanafuda ? 0.009 : 0.015);
    for (let i = 0; i < n; i++) {
      const isLast = i === n - 1;
      const j = 0.93 + Math.random() * 0.14;
      const pan = (i - (n - 1) / 2) * 0.05;

      // 乾いた紙同士が擦れ合う音
      emitFriction(
        ac,
        cursor,
        isLast ? 0.020 : 0.015,
        mat.fricCenter * (isLast ? 0.92 : 1.08) * j,
        (isLast ? 0.24 : 0.16) * mat.fricGain,
        pan
      );

      // 紙のしなりが弾ける乾いたクラック（「パチッ／ピシッ」）
      emitSnap(
        ac,
        cursor + 0.003,
        mat.snapCenter * (isLast ? 0.96 : 1.1) * j,
        (isLast ? 0.44 : 0.26) * mat.snapGain,
        pan
      );

      // 着地の低音はごく控えめに添えるだけ
      if (isLast) {
        emitAirPocket(ac, cursor + 0.003, mat.airFreq * j, mat.airGain, pan);
        emitTableModal(ac, cursor + 0.003, mat.tableModes, 0.7, pan);
      }

      cursor += Math.max(0.021, 0.036 - i * 0.003 + (Math.random() * 0.005 - 0.0025));
    }
  }

  // パス（爪先・指先で軽く「コツ、コツ」と2回ノック）
  function pass() {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const base = ac.currentTime;
    [0, 0.115].forEach((off, idx) => {
      const t = base + off + (idx === 1 ? (Math.random() * 0.010 - 0.005) : 0);
      const scale = idx === 0 ? 1.0 : 0.82;
      emitTableModal(ac, t, mat.knockModes, scale, 0.14);
      emitSnap(ac, t, 1850, 0.16 * scale, 0.14);
    });
  }

  // 場が流れる・8切り（乾いた札を「ササッ、カサッ」とひとまとめに寄せる）
  function sweep() {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const t = ac.currentTime;
    emitFriction(ac, t, 0.12, mat.fricCenter * 0.88, 0.30 * mat.fricGain, -0.08);
    emitFriction(ac, t + 0.038, 0.10, mat.fricCenter * 1.06, 0.23 * mat.fricGain, 0.06);
    emitSnap(ac, t + 0.105, mat.snapCenter * 0.92, 0.24 * mat.snapGain, 0.10);
  }

  // 7渡し・10捨て・交換・並べ替え（カードを滑らせて渡す／揃える音）
  function slide(count = 1) {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const n = Math.max(1, Math.min(count || 1, 3));
    const base = ac.currentTime;
    for (let i = 0; i < n; i++) {
      const t = base + i * 0.062;
      const j = 0.94 + Math.random() * 0.12;
      const pan = (i - 1) * 0.08;
      emitFriction(ac, t, 0.055, mat.fricCenter * 0.9 * j, 0.25 * mat.fricGain, pan);
      emitSnap(ac, t + 0.042, mat.snapCenter * 1.06 * j, 0.18 * mat.snapGain, pan);
    }
  }

  // 革命・階段革命・11バック（札の束をひっくり返す乾いた「パサッ…パチッ！」）
  function flip() {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const t = ac.currentTime;
    emitFriction(ac, t, 0.040, mat.fricCenter * 0.96, 0.28 * mat.fricGain, -0.05);
    emitSnap(ac, t + 0.011, mat.snapCenter * 1.08, 0.28 * mat.snapGain, -0.05);

    emitFriction(ac, t + 0.074, 0.030, mat.fricCenter * 0.85, 0.28 * mat.fricGain, 0.05);
    emitSnap(ac, t + 0.079, mat.snapCenter * 0.92, 0.50 * mat.snapGain, 0.05);
    emitAirPocket(ac, t + 0.079, mat.airFreq, mat.airGain * 1.1, 0.05);
    emitTableModal(ac, t + 0.079, mat.tableModes, 0.85, 0.05);
  }

  // ゲーム開始時のカード配布（親指で角を弾いて配る乾いたディール音）
  function deal(count = 7) {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const n = Math.max(4, Math.min(count || 7, 8));
    const base = ac.currentTime + 0.03;
    for (let i = 0; i < n; i++) {
      const t = base + i * 0.056 + (Math.random() * 0.008 - 0.004);
      const j = 0.93 + Math.random() * 0.14;
      const pan = ((i % 4) - 1.5) * 0.12;
      emitSnap(ac, t, mat.snapCenter * 1.15 * j, 0.22 * mat.snapGain, pan);
      emitFriction(ac, t + 0.004, 0.024, mat.fricCenter * 0.98 * j, 0.21 * mat.fricGain, pan);
    }
  }

  // 自分の手番通知（手札の角を軽く揃える極小の乾いた紙音）
  function turn() {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const t = ac.currentTime;
    emitSnap(ac, t, mat.snapCenter * 1.2, 0.14 * mat.snapGain, 0);
    emitFriction(ac, t + 0.004, 0.015, mat.fricCenter * 1.05, 0.11 * mat.fricGain, 0);
  }

  // 上がり（最後の札を出し切り、手札を卓に置く乾いた着地音）
  function finish() {
    const ac = ensure();
    if (!ac) return;
    const mat = getMaterial();
    const t = ac.currentTime;
    emitFriction(ac, t, 0.028, mat.fricCenter * 0.92, 0.25 * mat.fricGain, 0);
    emitSnap(ac, t + 0.004, mat.snapCenter * 0.95, 0.44 * mat.snapGain, 0);
    emitAirPocket(ac, t + 0.004, mat.airFreq, mat.airGain, 0);
    emitTableModal(ac, t + 0.004, mat.tableModes, 0.75, 0);
    emitFriction(ac, t + 0.062, 0.038, mat.fricCenter * 0.82, 0.13 * mat.fricGain, 0.06);
  }

  function setEnabled(v) {
    enabled = !!v;
    try { localStorage.setItem(KEY, enabled ? '1' : '0'); } catch (e) {}
    if (enabled) select(true);
    return enabled;
  }

  function toggle() {
    return setEnabled(!enabled);
  }

  return {
    get enabled() { return enabled; },
    setEnabled,
    toggle,
    unlock: ensure,
    select,
    play,
    pass,
    sweep,
    slide,
    flip,
    deal,
    turn,
    finish,
  };
})();

/* =====================================================================
 * 1. ゲームロジック（DOM非依存の純粋な関数群）
 *    ルール判定・状態遷移はすべてここで行う。UIは状態を描画するだけ。
 * ===================================================================== */
const Logic = (() => {
  const SUITS = ['S', 'H', 'D', 'C'];
  const SUIT_SYM = { S: '♠', H: '♥', D: '♦', C: '♣', X: '★' };
  const JOKER = 16;
  const LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2' };
  const ROLE_NAMES = ['大富豪', '富豪', '平民', '貧民', '大貧民'];

  const label = n => LABEL[n] || String(n);
  const isJoker = c => c.num === JOKER;
  const fail = reason => ({ ok: false, reason });
  const removeCards = (hand, cards) => { const ids = new Set(cards.map(c => c.id)); return hand.filter(c => !ids.has(c.id)); };
  const kindText = (kind, len, rev) => rev ? `${len}枚の階段革命`
    : kind === 'stair' ? `${len}枚の階段` : len === 1 ? '1枚' : `${len}枚の組`;

  function createDeck() {
    const deck = []; let id = 0;
    for (const s of SUITS) for (let n = 3; n <= 15; n++) deck.push({ id: id++, suit: s, num: n });
    deck.push({ id: id++, suit: 'X', num: JOKER }, { id: id++, suit: 'X', num: JOKER });
    return deck;
  }
  function shuffle(a, rng = Math.random) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function dealHands(n) {
    const d = shuffle(createDeck());
    const hands = Array.from({ length: n }, () => []);
    d.forEach((c, i) => hands[i % n].push(c));
    return hands;
  }
  function ctxOf(state) {
    return { rules: state.rules, revolution: state.revolution, elevenBack: state.elevenBack,
      field: state.field ? state.field.cards : null, fieldInfo: state.field };
  }
  // 実効的な強さ。革命と11バックの二重適用で元に戻る。ジョーカーは影響を受けない。
  function cardPower(c, ctx) {
    if (isJoker(c)) return 100;
    return (ctx.revolution !== ctx.elevenBack) ? 18 - c.num : c.num;
  }
  const numPower = (n, ctx) => cardPower({ suit: 'S', num: n }, ctx);
  // 階段の候補。ジョーカーは範囲の中で不足した数字を埋める（ワイルド）。候補は数字の範囲 {lo, hi}。
  function stairWindows(cards) {
    const nat = cards.filter(c => !isJoker(c));
    const L = cards.length;
    if (L < 3 || nat.length === 0) return [];
    const suit = nat[0].suit;
    if (nat.some(c => c.suit !== suit)) return [];
    const nums = nat.map(c => c.num);
    if (new Set(nums).size !== nums.length) return [];
    const out = [];
    for (let lo = 3; lo + L - 1 <= 15; lo++) {
      const hi = lo + L - 1;
      if (Math.min(...nums) >= lo && Math.max(...nums) <= hi) out.push({ lo, hi, suit });
    }
    return out;
  }
  function isStairShape(cards) { return stairWindows(cards).length > 0; }
  // 両方ONのときは mode で選ぶ。片方だけONならそれに従う。
  function resolveStairMode(mode, r) {
    if (r.stairs && r.stairRev) return mode;
    if (r.stairs) return 'normal';
    if (r.stairRev) return 'rev';
    return null;
  }
  // 手の種類判定（場の制約は含めない）。effNums はジョーカーを埋めた後の数字。
  function playInfo(cards, ctx, mode = 'normal') {
    const r = ctx.rules;
    if (!cards.length) return fail('札を選んでください');
    const nat = cards.filter(c => !isJoker(c));
    if (!r.wild && nat.length && nat.length < cards.length) return fail('ジョーカーは、ワイルドをONにしたときだけ数字の代わりに使えます');
    // 数字の組（ジョーカーは同じ数字に合わせて入る）
    if (!nat.length || nat.every(c => c.num === nat[0].num)) {
      if (mode === 'rev') return fail('階段革命は同じマークの連続4枚以上で出してください');
      if (cards.length > (r.wild ? 6 : 4)) return fail('組は最大4枚です（ワイルドONのときはジョーカーを加えて最大6枚）');
      if (!nat.length) return { ok: true, kind: 'set', len: cards.length, power: 100, rev: false, effNums: [] };
      return { ok: true, kind: 'set', len: cards.length, power: cardPower(nat[0], ctx), rev: false,
        effNums: Array(cards.length).fill(nat[0].num) };
    }
    if (cards.length < 3) return fail('2枚は同じ数字の組で出してください');
    if (new Set(nat.map(c => c.suit)).size > 1) return fail('階段は同じマークで出してください');
    const eff = resolveStairMode(mode, r);
    if (!eff) return fail('階段はOFFです。同じ数字の組で出してください');
    if (eff === 'rev' && cards.length < 4) return fail('階段革命は同じマークの連続4枚以上で出してください');
    const wins = stairWindows(cards);
    if (!wins.length) return fail('階段は連続する数字で出してください');
    let best = null;
    for (const w of wins) {
      let power = -Infinity;
      for (let n = w.lo; n <= w.hi; n++) power = Math.max(power, numPower(n, ctx));
      if (!best || power > best.power) best = { ...w, power };
    }
    const effNums = [];
    for (let n = best.lo; n <= best.hi; n++) effNums.push(n);
    return { ok: true, kind: 'stair', len: cards.length, power: best.power, rev: eff === 'rev', effNums };
  }
  // 場に対して出せるかの総合判定。場の情報は ctx.fieldInfo（kind, len, power, rev）。
  function evaluatePlay(cards, ctx, mode = 'normal') {
    const p = playInfo(cards, ctx, mode);
    if (!p.ok) return p;
    const f = ctx.field, fi = ctx.fieldInfo;
    // 場の札の強さは、今の順番（革命・11バックの状態）で計算し直す。保存された値は古い順番のことがあるため使わない。
    const fieldPower = f && f.length && fi ? (playInfo(f, ctx, fi.rev ? 'rev' : 'normal').power) : null;
    if (f && f.length && fi && fi.unbeatable) return fail('スペードの3には勝てません。この場は流れるまで誰も勝てません');
    if (ctx.rules.spade3Joker && f && f.length === 1 && isJoker(f[0]) && fi && !fi.rev && cards.length === 1 && isSpadeThree(cards[0]))
      return { ...p, unbeatable: true };
    if (p.rev) {
      // 階段革命は、場が空（自分のターン）か、同じ枚数でより強い階段革命のときだけ。場は流さない。
      if (!f || !f.length) return p;
      if (fi && fi.rev && fi.len === p.len && p.power > fieldPower) return p;
      return fail('階段革命は、場が空のときか、同じ枚数でより強い階段革命のときだけ出せます');
    }
    if (!f || !f.length) return p;
    if (fi.rev) return fail('場が階段革命です。同じ枚数の階段革命で応じてください');
    if (ctx.rules.bind) {
      const suits = new Set(f.filter(c => !isJoker(c)).map(c => c.suit));
      if (suits.size && cards.some(c => !isJoker(c) && !suits.has(c.suit)))
        return fail('しばり中です。場と同じマークの札を出してください');
    }
    if (p.kind !== fi.kind || p.len !== fi.len) return fail('場と同じ枚数・形の手で出してください');
    if (p.power <= fieldPower) return fail('場の札より強い札を出してください');
    return p;
  }
  function combos(arr, k) {
    const out = [];
    const rec = (start, cur) => {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    };
    rec(0, []);
    return out;
  }
  // 手札から出せる全ての手。{cards, rev} の配列（CPUとハイライトで使用）
  function legalPlays(hand, ctx) {
    const out = [];
    const add = cards => {
      const a = evaluatePlay(cards, ctx, 'normal');
      if (a.ok) out.push({ cards, rev: !!a.rev });
      if (ctx.rules.stairs && ctx.rules.stairRev && cards.length >= 4 && evaluatePlay(cards, ctx, 'rev').ok)
        out.push({ cards, rev: true });
    };
    const nat = hand.filter(c => !isJoker(c));
    const jokers = hand.filter(isJoker);
    // 数字の組（ワイルドONならジョーカーで不足分を埋める）
    const byNum = new Map();
    // ワイルドONのときは、ジョーカーを使って最大6枚の組まで作れる（OFFのときは4枚まで）
    const maxSet = ctx.rules.wild ? 6 : 4;
    nat.forEach(c => { if (!byNum.has(c.num)) byNum.set(c.num, []); byNum.get(c.num).push(c); });
    for (const arr of byNum.values()) {
      for (let m = 1; m <= Math.min(arr.length, 4); m++) {
        combos(arr, m).forEach(base => {
          for (let jk = 0; jk <= Math.min(jokers.length, maxSet - m); jk++) add(base.concat(jokers.slice(0, jk)));
        });
      }
    }
    for (let jk = 1; jk <= Math.min(jokers.length, 2); jk++) add(jokers.slice(0, jk));
    // 階段（同じマークの連続。抜けはジョーカーで埋める。長さは3〜13枚（数字の種類数まで））
    if (ctx.rules.stairs || ctx.rules.stairRev) {
      for (const s of SUITS) for (let L = 3; L <= 13; L++) for (let lo = 3; lo + L - 1 <= 15; lo++) {
        const hi = lo + L - 1;
        const cs = nat.filter(c => c.suit === s && c.num >= lo && c.num <= hi);
        const need = L - cs.length;
        if (!cs.length || need > jokers.length) continue;
        add(cs.concat(jokers.slice(0, need)));
      }
    }
    return out.filter(x => !bansStrongFinish(x.cards, hand, ctx, x.rev ? 'rev' : 'normal'));
  }
  function pickStrongest(hand, count, ctx) {
    // ジョーカーも最強の札として扱う（強い順に並べるので、ジョーカーが先に選ばれる）
    return hand.slice().sort((a, b) => cardPower(b, ctx) - cardPower(a, ctx)).slice(0, count);
  }

  function roleForRank(rank, n) {
    if (n === 3) return ['大富豪', '平民', '大貧民'][rank - 1];
    if (rank === 1) return '大富豪';
    if (rank === 2) return '富豪';
    if (rank === n) return '大貧民';
    if (rank === n - 1) return '貧民';
    return '平民';
  }
  function leaderIndex(state) {
    // 「毎回大富豪から始める」がONで大富豪がいれば、その人から始める。それ以外は♦3の持ち主から。
    if (state.rules.richStart) {
      const rich = state.players.find(p => p.role === '大富豪');
      if (rich) return rich.id;
    }
    const p = state.players.find(p => p.hand.some(c => c.suit === 'D' && c.num === 3));
    return p ? p.id : 0;
  }
  function nextIndex(state, from) {
    const n = state.players.length;
    const owner = state.field ? state.field.owner : -1;
    for (let k = 1; k <= n; k++) {
      const i = (from + k) % n;
      const p = state.players[i];
      if (p.finished || state.passed[i] || i === owner) continue;
      return i;
    }
    return from;
  }
  // 7渡しの相手：出した人の次の席で、まだ上がっていないプレイヤー
  function nextSeat(state, from) {
    const n = state.players.length;
    for (let k = 1; k < n; k++) { const i = (from + k) % n; if (!state.players[i].finished) return i; }
    return null;
  }
  function sevenTargets(state, from) {
    const i = nextSeat(state, from);
    return i == null ? [] : [state.players[i]];
  }

  function startGame(series) {
    const n = series.players.length;
    const hands = dealHands(n);
    const players = series.players.map((p, i) => ({
      id: i, name: p.name, isHuman: p.isHuman, level: p.level,
      hand: hands[i], finished: false, rank: null, role: p.role || null,
    }));
    const state = {
      players, rules: { ...series.rules }, revolution: false, elevenBack: false, revCount: 0,
      field: null, passed: Array(n).fill(false), turn: 0, finishOrder: [], over: false,
      phase: 'play', played: [], hist: [], exchanges: [], pendingSeven: null,
      playId: 0, recorded: false, fallenId: null, pendingDiscard: null,
    };
    if (series.rules.exchange && players.every(p => p.role)) {
      const pairs = [['大貧民', '大富豪', 2]];
      if (n >= 4) pairs.push(['貧民', '富豪', 1]);
      for (const [g, r, count] of pairs) {
        const giver = players.find(p => p.role === g), recv = players.find(p => p.role === r);
        if (!giver || !recv) continue;
        state.exchanges.push({ giver: giver.id, receiver: recv.id, count, stage: 'give', given: [], returned: [] });
      }
      if (state.exchanges.length) state.phase = 'exchange';
    }
    state.turn = leaderIndex(state);
    return state;
  }
  function pendingExchange(state) { return state.exchanges.find(e => e.stage !== 'done') || null; }
  function exchangeGive(state, ex, cards) {
    if (ex.stage !== 'give') return fail('交換の順番ではありません');
    const giver = state.players[ex.giver], recv = state.players[ex.receiver];
    if (cards.length !== ex.count) return fail(`${ex.count}枚選んでください`);
    if (new Set(cards.map(c => c.id)).size !== cards.length) return fail('同じ札は選べません');
    const ids = new Set(giver.hand.map(c => c.id));
    if (cards.some(c => !ids.has(c.id))) return fail('手札から選んでください');
    giver.hand = removeCards(giver.hand, cards);
    recv.hand = recv.hand.concat(cards);
    ex.given = cards.slice();
    ex.stage = 'return';
    return { ok: true };
  }
  function exchangeReturn(state, ex, cards) {
    if (ex.stage !== 'return') return fail('交換の順番ではありません');
    const giver = state.players[ex.giver], recv = state.players[ex.receiver];
    if (cards.length !== ex.count) return fail(`${ex.count}枚選んでください`);
    if (new Set(cards.map(c => c.id)).size !== cards.length) return fail('同じ札は選べません');
    const ids = new Set(recv.hand.map(c => c.id));
    if (cards.some(c => !ids.has(c.id))) return fail('手札から選んでください');
    recv.hand = removeCards(recv.hand, cards);
    giver.hand = giver.hand.concat(cards);
    ex.returned = cards.slice();
    ex.stage = 'done';
    if (!pendingExchange(state)) { state.phase = 'play'; state.turn = leaderIndex(state); }
    return { ok: true };
  }

  const isSpadeThree = c => c.suit === 'S' && c.num === 3;
  // 禁止上がりの判定で「最強の札」かどうか。場の状況で決まる。
  // 11バックの逆転は、Jが出てから場が流れるまで続く（ctx.elevenBack）。スペードの3は、場にジョーカーがあるときだけ最強扱い。
  function isStrongest(c, ctx) {
    const field = ctx.field || [];
    const fieldHasJoker = field.some(x => isJoker(x));
    if (isJoker(c)) return true;
    if (ctx.rules.spade3Joker && isSpadeThree(c)) return fieldHasJoker;
    const top = Math.max(...Array.from({ length: 13 }, (_, i) => numPower(i + 3, ctx)));
    return numPower(c.num, ctx) === top;
  }
  const topPower = ctx => Math.max(...Array.from({ length: 13 }, (_, i) => numPower(i + 3, ctx)));
  // 上がり時の最強判定。ワイルドで数字の代わりになったジョーカーは、その数字の強さで判定する
  function bansStrongFinish(cards, hand, ctx, mode = 'normal') {
    if (!ctx.rules.noStrongFinish || cards.length !== hand.length) return false;
    if (cards.every(isJoker)) return true;                                   // ジョーカーだけの手
    if (cards.some(c => !isJoker(c) && isStrongest(c, ctx))) return true;   // 最強の数字・スペードの3を含む
    if (cards.some(isJoker)) {
      const info = playInfo(cards, ctx, mode);                              // ワイルドの数字で判定
      return info.ok && info.power === topPower(ctx);
    }
    return false;
  }
  // 上がれないまま残った人を最下位にする（ゲーム終了時に順位を付ける）
  function finalizeStuck(state) {
    state.players.filter(p => p.stuck && p.rank == null).forEach(p => {
      p.rank = state.finishOrder.length + 1;
      state.finishOrder.push(p.id);
    });
  }
  // 自分の番で出せる手が1つもない（残りが上がり禁止の札だけ）なら、その人は上がれないまま残る
  function stuckCheck(state) {
    if (state.over || state.phase !== 'play' || state.field) return false;
    const p = state.players[state.turn];
    if (!p || p.finished || !p.hand.length) return false;
    if (legalPlays(p.hand, ctxOf(state)).length) return false;
    p.finished = true; p.stuck = true;
    const active = state.players.filter(x => !x.finished);
    if (active.length <= 1) {
      if (active.length === 1) {
        const last = active[0];
        last.finished = true; last.rank = state.finishOrder.length + 1; state.finishOrder.push(last.id);
      }
      state.over = true;
      finalizeStuck(state);
    } else state.turn = nextIndex(state, p.id);
    return true;
  }
  function finishPlayer(state, idx, ev) {
    const p = state.players[idx];
    p.finished = true;
    p.rank = state.finishOrder.length + 1;
    state.finishOrder.push(idx);
    ev.push({ type: 'finish', idx, rank: p.rank });
    const active = state.players.filter(x => !x.finished);
    if (active.length <= 1) {
      if (active.length === 1) {
        const last = active[0];
        last.finished = true;
        last.rank = state.finishOrder.length + 1;
        state.finishOrder.push(last.id);
        ev.push({ type: 'finish', idx: last.id, rank: last.rank });
      }
      state.over = true;
      finalizeStuck(state);
    }
  }
  function clearField(state) {
    state.field = null;
    state.elevenBack = false;
    state.passed.fill(false);
    state.passRecord = {};
  }
  function finishTurn(state, idx, continueSelf) {
    if (state.over) return;
    const p = state.players[idx];
    state.turn = (continueSelf && !p.finished) ? idx : nextIndex(state, idx);
  }
  function toggleRevolution(state, ev, kind) {
    state.revolution = !state.revolution;
    state.revCount++;
    ev.push({ type: kind, on: state.revolution });
  }

  // 後処理の順番：7渡し → 10捨て → 8切り（8切りは一番最後）。
  // 10捨てがあれば先に捨て札を選ばせ、終わってから8切りで場を流す。
  function finishEffects(state, idx, tens, eight, ev) {
    const p = state.players[idx];
    if (tens > 0 && !p.finished && p.hand.length > 0) {
      state.phase = 'discard';
      state.pendingDiscard = { from: idx, remaining: Math.min(tens, p.hand.length), eight };
      return;
    }
    if (eight) { clearField(state); ev.push({ type: 'eight' }); }
    finishTurn(state, idx, eight && !p.finished);
  }
  // 捨て札：選んだ札を手札から外し、場には出さず、ゲームから外す（CPUの計算では見えた札として扱う）
  // 必要枚数：残り枚数と手札枚数の小さい方
  function discardNeed(state, idx) {
    const d = state.pendingDiscard;
    return d ? Math.min(d.remaining, state.players[idx].hand.length) : 0;
  }
  function discardCards(state, idx, cardIds) {
    const d = state.pendingDiscard;
    if (!d || state.phase !== 'discard' || d.from !== idx) return fail('捨て札の処理中ではありません');
    const p = state.players[idx];
    const need = discardNeed(state, idx);
    if (cardIds.length !== need) return fail(`${need}枚選んでください`);
    if (new Set(cardIds).size !== cardIds.length) return fail('同じ札は選べません');
    const cards = p.hand.filter(c => cardIds.includes(c.id));
    if (cards.length !== cardIds.length) return fail('手札から選んでください');
    p.hand = removeCards(p.hand, cards);
    state.played.push(...cards);
    state.pendingDiscard = null;
    state.phase = 'play';
    const ev = [{ type: 'discard', idx, n: cards.length, cards }];
    if (p.hand.length === 0) finishPlayer(state, idx, ev);
    if (!state.over) finishEffects(state, idx, 0, d.eight, ev);
    return { ok: true, events: ev };
  }
  function applyPlay(state, idx, cards, mode = 'normal') {
    const ctx = ctxOf(state);
    const info = evaluatePlay(cards, ctx, mode);
    if (!info.ok) return info;
    if (bansStrongFinish(cards, state.players[idx].hand, ctx, info.rev ? 'rev' : 'normal')) return fail('最強のカードでは上がれません');
    const p = state.players[idx];
    const nums = info.effNums;
    p.hand = removeCards(p.hand, cards);
    state.played.push(...cards);
    (state.hist = state.hist || []).push({ idx, pass: false, n: cards.length, p: info.power });
    state.playId++;
    state.passed.fill(false);
    state.field = { cards: cards.slice(), owner: idx, kind: info.kind, len: info.len, rev: info.rev, power: info.power, unbeatable: !!info.unbeatable };
    const ev = [{ type: 'play', idx, cards: cards.slice(), kind: info.kind, len: info.len, rev: info.rev }];
    if (info.unbeatable) ev.push({ type: 'spade3' });

    if (info.rev) toggleRevolution(state, ev, 'stairRev');
    else if (info.kind === 'set' && info.len >= 4 && state.rules.revolution && (info.len === 4 || state.rules.revMin4)) toggleRevolution(state, ev, 'revolution');

    if (nums.includes(11) && state.rules.elevenBack && !state.elevenBack) {
      state.elevenBack = true;
      ev.push({ type: 'eleven' });
    }

    // 8切り・10捨ては階段革命の手でも発動する。8切りは、7渡し・10捨ての後に最後に行う。10捨ては場を流さない。
    const eight = !!state.rules.eightCut && nums.includes(8);
    const tens = state.rules.tenDump ? nums.filter(n => n === 10).length : 0;
    if (tens) ev.push({ type: 'ten', n: tens });

    if (p.hand.length === 0) finishPlayer(state, idx, ev);
    if (state.over) return { ok: true, events: ev };

    const sevens = nums.filter(n => n === 7).length;
    if (state.rules.sevenPass && sevens > 0 && p.hand.length > 0 && sevenTargets(state, idx).length > 0) {
      state.phase = 'seven';
      state.pendingSeven = { from: idx, remaining: Math.min(sevens, p.hand.length), tens, eight };
      ev.push({ type: 'sevenStart', idx });
      return { ok: true, events: ev };
    }
    finishEffects(state, idx, tens, eight, ev);
    return { ok: true, events: ev };
  }
  function applyPass(state, idx) {
    if (!state.field) return fail('場が出ていないのでパスできません');
    // パスした時点の場と革命・11バックの状態を覚える（極めて強いの推測に使う）
    state.passRecord = state.passRecord || {};
    state.passRecord[idx] = { field: { ...state.field, cards: state.field.cards.slice() }, revolution: state.revolution, elevenBack: state.elevenBack };
    state.passed[idx] = true;
    (state.hist = state.hist || []).push({ idx, pass: true, n: 0, p: 0 });
    const ev = [{ type: 'pass', idx }];
    const owner = state.field.owner;
    const remaining = state.players.filter(p => !p.finished && p.id !== owner && !state.passed[p.id]);
    if (remaining.length === 0) {
      clearField(state);
      ev.push({ type: 'flush' });
      state.turn = state.players[owner].finished ? nextIndex(state, owner) : owner;
    } else {
      state.turn = nextIndex(state, idx);
    }
    return { ok: true, events: ev };
  }
  // 必要枚数：残り枚数と手札枚数の小さい方（手札が足りないときはある分だけ渡す）
  function sevenNeed(state) {
    const s = state.pendingSeven;
    return s ? Math.min(s.remaining, state.players[s.from].hand.length) : 0;
  }
  // 7渡し：選んだ枚数ぶんの札をまとめて、次の手番の上がっていないプレイヤーに渡す（渡す相手は1人に決まる）
  function giveSevenCards(state, cardIds) {
    const s = state.pendingSeven;
    if (!s || state.phase !== 'seven') return fail('7渡しの処理中ではありません');
    const from = state.players[s.from];
    const need = sevenNeed(state);
    if (cardIds.length !== need) return fail(`${need}枚選んでください`);
    if (new Set(cardIds).size !== cardIds.length) return fail('同じ札は選べません');
    const cards = from.hand.filter(c => cardIds.includes(c.id));
    if (cards.length !== cardIds.length) return fail('手札から選んでください');
    const targets = sevenTargets(state, s.from);
    if (!targets.length) return fail('渡せる相手がいません');
    const target = targets[0];
    from.hand = removeCards(from.hand, cards);
    target.hand = target.hand.concat(cards);
    const ev = [{ type: 'give', from: s.from, to: target.id, n: cards.length }];
    completeSeven(state, ev);
    return { ok: true, events: ev };
  }
  function completeSeven(state, ev) {
    const s = state.pendingSeven;
    state.pendingSeven = null;
    state.phase = 'play';
    const from = state.players[s.from];
    if (!from.finished && from.hand.length === 0) finishPlayer(state, s.from, ev);
    if (!state.over) finishEffects(state, s.from, s.tens, s.eight, ev);
  }

  // 役の割り当て。順位どおりに役を決める。都落ちONで、前回の大富豪が今回1位でなければ大貧民に落とす。
  function assignRoles(state) {
    const n = state.players.length;
    const order = [...state.players].sort((a, b) => a.rank - b.rank);
    state.fallenId = null;
    if (state.rules.outcast) {
      const fallen = state.players.find(p => p.role === '大富豪');
      if (fallen && fallen.rank !== 1) {
        state.fallenId = fallen.id;
        order.splice(order.indexOf(fallen), 1);
        order.push(fallen);
      }
    }
    order.forEach((p, i) => { p.role = roleForRank(i + 1, n); });
    return state.players.map(p => p.role);
  }

  return {
    SUITS, SUIT_SYM, ROLE_NAMES, label, isJoker, kindText, createDeck, shuffle,
    cardPower, isStairShape, playInfo, evaluatePlay, legalPlays, ctxOf, nextSeat, stuckCheck, isStrongest,
    startGame, pendingExchange, pickStrongest, exchangeGive, exchangeReturn,
    sevenTargets, sevenNeed, discardNeed, giveSevenCards, applyPlay, applyPass, assignRoles, leaderIndex, discardCards,
    roleForRank, removeCards,
  };
})();

/* =====================================================================
 * 2. CPU思考。自分の手札と公開情報だけを受け取る。他人の手札は参照しない。
 *    強さ：圧倒的に弱い < 極めて弱い < とても弱い < 弱い < 普通 < 強い < とても強い < 極めて強い < 圧倒的に強い
 * ===================================================================== */
const CPU = (() => {
  const L = Logic;

  function view(state, idx) {
    return {
      me: idx,
      hand: state.players[idx].hand.slice(),
      rules: state.rules,
      revolution: state.revolution,
      elevenBack: state.elevenBack,
      field: state.field ? state.field.cards.slice() : null,
      fieldObj: state.field ? { ...state.field, cards: state.field.cards.slice() } : null,
      fieldInfo: state.field ? { kind: state.field.kind, len: state.field.len, rev: state.field.rev, power: state.field.power, unbeatable: state.field.unbeatable } : null,
      others: state.players.filter(p => p.id !== idx).map(p => ({
        id: p.id, count: p.hand.length, finished: p.finished, passed: state.passed[p.id],
      })),
      passed: state.passed.slice(),
      played: state.played.slice(),
      finishOrder: state.finishOrder.slice(),
      passRec: { ...(state.passRecord || {}) },
      hist: (state.hist || []).slice(),
      nextSeat: L.nextSeat(state, idx),
    };
  }
  function unseen(v) {
    const seen = new Set([...v.played.map(c => c.id), ...v.hand.map(c => c.id)]);
    return L.createDeck().filter(c => !seen.has(c.id));
  }
  const ctxOf = v => ({ rules: v.rules, revolution: v.revolution, elevenBack: v.elevenBack, field: v.field, fieldInfo: v.fieldInfo });
  const flushes = (cards, rules, rev) => !!rules.eightCut && cards.some(c => c.num === 8);
  const rnd = a => a[Math.floor(Math.random() * a.length)];

  // 出すと一気に減らせる枚数：7渡し（7の枚数ぶん渡す）・10捨て（10の枚数ぶん捨てる）。手札の残りを超えない
  function reduceExtra(cards, v) {
    const left = Math.max(0, v.hand.length - cards.length);
    const give = v.rules.sevenPass ? Math.min(cards.filter(c => c.num === 7).length, left) : 0;
    const drop = v.rules.tenDump ? Math.min(cards.filter(c => c.num === 10).length, Math.max(0, left - give)) : 0;
    return give + drop;
  }
  // 革命を狙える手か：今は革命中でなく、その手を出すと革命になる（階段革命、または同じ数字の組）
  const makesRevolution = (x, ctx) => !ctx.revolution && (x.rev || (!!ctx.rules.revolution && x.cards.length >= 4
    && L.playInfo(x.cards, ctx, 'normal').kind === 'set' && (x.cards.length === 4 || !!ctx.rules.revMin4)));
  function revIntentCtx(hand, ctx) {
    if (ctx.revolution) return false;
    const c = { rules: ctx.rules, revolution: false, elevenBack: false, field: null, fieldInfo: null };
    return L.legalPlays(hand, c).some(x => makesRevolution(x, c));
  }
  const revIntent = v => revIntentCtx(v.hand, { rules: v.rules, revolution: v.revolution });

  function strongPick(v, ctx, items, lead) {
    const pool = unseen(v);
    const bestOf = cards => cards.reduce((a, b) => (L.cardPower(b, ctx) > L.cardPower(a, ctx) ? b : a));
    const isTop = c => { const pw = L.cardPower(c, ctx); return !pool.some(u => L.cardPower(u, ctx) > pw); };
    const urgent = v.others.some(o => !o.finished && o.count <= 2);
    const intent = revIntent(v);
    if (lead) {
      items.forEach(x => {
        x.score = x.n * 2 - x.p * 0.3 + (isTop(bestOf(x.cards)) ? 3 : 0) + (x.rev ? 1 : 0) + (x.flush ? 2 : 0)
          + x.ext * 2.5                                   // 7渡し・10捨てで一気に減らせる
          + (intent ? (x.revMake ? 4 : x.p * 0.15) : 0);  // 革命を狙うときは革命を優先し、強い札を早めに使う
      });
      items.sort((a, b) => b.score - a.score);
      return items[0];
    }
    const normals = items.filter(x => !x.rev).sort((a, b) => a.p - b.p);
    if (!normals.length) return v.hand.length <= 3 ? items.find(x => x.rev) : null;
    const fieldInfo = v.fieldInfo || { power: 0 };
    const flushOpt = normals.find(x => x.flush && fieldInfo.power >= 13);
    if (flushOpt) return flushOpt;
    if (intent) {
      const revOpt = items.find(x => x.revMake);
      if (revOpt) return revOpt;
      // 革命を狙うとき：ジョーカーを除く強い札を、先に出して消費する
      const early = normals.filter(x => x.p >= 12 && !x.cards.some(c => L.isJoker(c)));
      if (early.length) return early[early.length - 1];
    }
    // 7渡し・10捨てで一気に減らせる手（強すぎない札に限る）
    const reducer = normals.filter(x => x.ext >= 2 && x.p < 30).sort((a, b) => b.ext - a.ext || a.p - b.p)[0];
    if (reducer) return reducer;
    if (!urgent && normals[0].p >= 15 && v.hand.length > 3) return null;
    return normals[0];
  }

  /* ---------- とても強い：先読み（確定情報の推測つきシミュレーション） ----------
   * 1. 他の人の手札は見えていない札（場・捨て札・自分の手札以外）から、枚数どおりに無作為に当てはめる。
   * 2. 候補の手（パスを含む）ごとに、当てはめた手札で最後まで展開し、自分の最終順位の平均を比べる。
   * 3. 同じ当てはめを全候補で使う（比較の公平さ）。時間の上限を超えたら、それまでの最善を選ぶ。
   * 展開の後の他の人・自分は、中くらいの強さ（普通）の考え方で打つ。 */
  // 強さごとの探索設定。極めて強いは、パスの情報を推測に使い、展開の手は強いの考え方で打つ
  const MC_CFG = {
    'とても強い': { samples: 8, maxCandidates: 10, budgetMs: 600, policy: '普通', usePass: false },
    '極めて強い': { samples: 12, maxCandidates: 12, budgetMs: 2000, policy: '強い', usePass: true },
    // 圧倒的に強い：推測の数を増やし、順位だけでなく「最下位になる確率」も避ける。終盤は推測を増やす
    '圧倒的に強い': { samples: 32, maxCandidates: 15, budgetMs: 1800, maxIters: 6000, policy: "強い", usePass: true, bottomW: 0.32, endgameBoost: 1.5, treeDepth: 3, priorW: 0.58, leafEval: true, rolloutSteps: 85, exactMax: 48, C: 0.42 },
  };

  function mcPick(v, ctx, items, lead, cfg) {
    const start = Date.now();
    const MC = { ...cfg, maxSteps: 220 };
    const n = v.others.length + 1;
    // 候補：同じ種類・強さの手は1つにまとめ、弱い順に並べて均等に間引く
    const seen = new Set();
    const uniq = items.filter(x => {
      const k = `${x.n}|${x.p}|${x.rev}|${x.flush}|${x.ext}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    }).sort((a, b) => a.p - b.p);
    let cands = uniq;
    if (uniq.length > MC.maxCandidates) {
      // 7渡し・10捨てで減らせる手と、革命の手は、間引きの前に必ず候補に残す
      const must = uniq.filter(x => x.ext > 0 || x.revMake);
      const rest = uniq.filter(x => !must.includes(x));
      const room = Math.max(2, MC.maxCandidates - must.length);
      const step = (rest.length - 1) / Math.max(1, room - 1);
      const picked = rest.length ? Array.from({ length: Math.min(room, rest.length) }, (_, i) => rest[Math.round(i * step)]) : [];
      cands = must.concat(picked.filter(x => !must.includes(x)));
    }
    const options = cands.map(x => ({ item: x }));
    if (!lead) options.push({ item: null }); // パス

    const pool = unseen(v);
    const dealOnce = () => {
      const deck = L.shuffle(pool.slice());
      const hands = {};
      let k = 0;
      v.others.forEach(o => { hands[o.id] = o.finished ? [] : deck.slice(k, k + o.count); k += o.count; });
      return hands;
    };
    // パスした人は、パスした時点の場に勝てる札を持っていない、と仮定して配り直す（最大40回。見つからなければ最後の配り方）
    const passRecs = MC.usePass ? Object.entries(v.passRec || {}).map(([id, rec]) => [+id, rec]).filter(([id]) => id !== v.me) : [];
    const consistent = hands => passRecs.every(([id, rec]) => {
      const c = L.ctxOf({ rules: v.rules, revolution: rec.revolution, elevenBack: rec.elevenBack, field: rec.field });
      return L.legalPlays(hands[id] || [], c).length === 0;
    });
    const sampleHands = () => {
      let h = dealOnce();
      for (let t = 0; t < 40 && !consistent(h); t++) h = dealOnce();
      return h;
    };
    const makeState = hands => ({
      players: Array.from({ length: n }, (_, id) => {
        const o = id === v.me ? null : v.others.find(x => x.id === id);
        return { id, name: '', isHuman: false, level: '普通', role: null, rank: null,
          hand: id === v.me ? v.hand.slice() : hands[id].slice(), finished: o ? !!o.finished : false };
      }),
      rules: v.rules, revolution: v.revolution, elevenBack: v.elevenBack, revCount: 0,
      field: v.fieldObj ? { ...v.fieldObj, cards: v.fieldObj.cards.slice() } : null,
      passed: v.passed.slice(), turn: v.me, finishOrder: v.finishOrder.slice(), over: false,
      phase: 'play', played: v.played.slice(), exchanges: [], pendingSeven: null, pendingDiscard: null,
      passRecord: { ...(v.passRec || {}) },
      playId: 0, recorded: true, fallenId: null,
    });
    // 展開：他の人と自分の後の手は「普通」で打つ（その先の手番ぶんは、ここでは深く読まない）
    const rollout = st => {
      let steps = 0;
      while (!st.over && steps++ < MC.maxSteps) {
        if (st.players[v.me].finished) break;
        if (st.phase === 'seven') {
          const s = st.pendingSeven;
          if (!L.giveSevenCards(st, chooseSevenCards(st.players[s.from].hand, L.sevenNeed(st), L.ctxOf(st), MC.policy)).ok) break;
          continue;
        }
        if (st.phase === 'discard') {
          const d = st.pendingDiscard;
          if (!L.discardCards(st, d.from, chooseDiscard(st.players[d.from].hand, L.discardNeed(st, d.from), L.ctxOf(st), MC.policy)).ok) break;
          continue;
        }
        if (st.phase !== 'play') break;
        if (L.stuckCheck(st) || st.over) continue;
        const idx = st.turn;
        if (st.players[idx].finished) break;
        const choice = choosePlay(view(st, idx), MC.policy);
        if (!choice) { if (!L.applyPass(st, idx).ok) break; }
        else if (!L.applyPlay(st, idx, choice.cards, choice.rev ? 'rev' : 'normal').ok) break;
      }
      return st;
    };
    const rankOf = st => (st.players[v.me].rank != null ? st.players[v.me].rank : n);

    // 終盤（手札が少ない）は推測を増やして、精度を上げる
    const sampleCount = Math.round(MC.samples * (v.hand.length <= 4 && MC.endgameBoost ? MC.endgameBoost : 1));
    const samples = Array.from({ length: sampleCount }, sampleHands);
    const bottomW = MC.bottomW || 0;
    let best = null, bestScore = Infinity;
    for (const opt of options) {
      if (best && Date.now() - start > MC.budgetMs) break;
      let total = 0, left = 0, bottom = 0;
      for (const hands of samples) {
        const st = makeState(hands);
        const ok = opt.item
          ? L.applyPlay(st, v.me, opt.item.cards, opt.item.rev ? 'rev' : 'normal').ok
          : L.applyPass(st, v.me).ok;
        if (!ok) { total += n + 1; bottom++; continue; }
        rollout(st);
        const rk = rankOf(st);
        total += rk;
        if (rk === n) bottom++;
        left += st.players[v.me].hand.length;
      }
      const score = total / samples.length + bottomW * (bottom / samples.length) + 0.01 * (left / samples.length);
      if (score < bestScore) { bestScore = score; best = opt; }
    }
    return best ? best.item : null;
  }


  // ---------- 圧倒的に強い：不完全情報向けの探索（ISMCTS）と推定 ----------
  const runSync = gen => { let r; do { r = gen.next(); } while (!r.done); return r.value; };
  const actKey = (cards, rev) => (rev ? 'R' : 'N') + cards.map(c => c.id).sort().join('.');
  const cpOf = c => Math.min(15, L.cardPower(c, { revolution: false, elevenBack: false }));
  // 相手ごとの傾向：パスが少ない人ほど、場に勝てる強い札を持っていそうだと推定する（推定の信号はパス率だけ）
  function ovTendency(v) {
    const turns = {}, passes = {};
    (v.hist || []).forEach(h => {
      if (h.idx === v.me) return;
      turns[h.idx] = (turns[h.idx] || 0) + 1;
      if (h.pass) passes[h.idx] = (passes[h.idx] || 0) + 1;
    });
    const t = {};
    v.others.forEach(o => {
      const rate = turns[o.id] ? (passes[o.id] || 0) / turns[o.id] : 0.4;
      t[o.id] = Math.max(-1, Math.min(1, (0.4 - rate) * 2.5));
    });
    return t;
  }
  // 推測の配り方：傾向に応じて、強い札を持っていそうな相手ほど強い札を多く配る（重み付きの抽出）
  function dealWeighted(pool, others, tilt) {
    const remaining = pool.slice();
    const hands = {};
    others.forEach(o => {
      const hand = [];
      const k = o.finished ? 0 : o.count;
      for (let i = 0; i < k && remaining.length; i++) {
        const ws = remaining.map(c => Math.exp(tilt[o.id] * (cpOf(c) - 8) / 7.5));
        const total = ws.reduce((a, b) => a + b, 0);
        let r = Math.random() * total, j = 0;
        for (; j < ws.length - 1; j++) { r -= ws[j]; if (r <= 0) break; }
        hand.push(remaining.splice(j, 1)[0]);
      }
      hands[o.id] = hand;
    });
    return hands;
  }
  // 手札全体の評価：上がるまでに必要な手番数の見積もり（組・階段・ジョーカー・上がり禁止の札を考慮）
  function finishEstimate(cards, ctx) {
    if (!cards.length) return 0;
    const jokers = cards.filter(c => L.isJoker(c)).length;
    const ranks = [...new Set(cards.filter(c => !L.isJoker(c)).map(c => c.num))].sort((a, b) => a - b);
    let groups = ranks.length;
    if (ctx.rules.stairs) {
      let run = 1;
      for (let i = 1; i <= ranks.length; i++) {
        if (i < ranks.length && ranks[i] === ranks[i - 1] + 1) { run++; continue; }
        if (run >= 3) groups -= run - 1; // 3枚以上の連続は階段1手にまとめられる
        run = 1;
      }
    }
    if (jokers) groups = Math.max(1, groups - 1); // ジョーカーは一つの組を補える
    if (ctx.rules.noStrongFinish) groups += cards.filter(c => L.isStrongest(c, ctx)).length / cards.length; // 最強の札は最後に残りやすい
    return Math.max(0, groups);
  }
  function capItems(items, max) {
    const seen = new Set();
    const uniq = items.filter(x => {
      const k = `${x.n}|${x.p}|${x.rev}|${x.flush}|${x.ext}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    }).sort((a, b) => a.p - b.p);
    if (uniq.length <= max) return uniq;
    const must = uniq.filter(x => x.ext > 0 || x.revMake);
    const rest = uniq.filter(x => !must.includes(x));
    const room = Math.max(2, max - must.length);
    const step = (rest.length - 1) / Math.max(1, room - 1);
    const picked = rest.length ? Array.from({ length: Math.min(room, rest.length) }, (_, i) => rest[Math.round(i * step)]) : [];
    return must.concat(picked.filter(x => !must.includes(x)));
  }
  // ISMCTS：推測した手札ごとに同じ木を辿り、行動の成績を木で共有する。木の手番は合法手生成と既存のルール判定だけを使う
  // 協調的に画面を止めないよう、途中で yield する（同期でも非同期でも同じ処理）
  const binom = (a, b) => { if (b < 0 || b > a) return 0; let r = 1; for (let i = 0; i < b; i++) r = r * (a - i) / (i + 1); return Math.round(r); };
  const kSubsets = (arr, k) => {
    if (k === 0) return [[]];
    if (arr.length < k) return [];
    const [h, ...t] = arr;
    return kSubsets(t, k - 1).map(s => [h, ...s]).concat(kSubsets(t, k));
  };
  function* ovGen(v, ctx, items, lead, cfg) {
    const n = v.others.length + 1;
    const bottomW = cfg.bottomW || 0;
    const deadline = Date.now() + cfg.budgetMs;
    const pool = unseen(v);
    const tilt = ovTendency(v);
    const passRecs = Object.entries(v.passRec || {}).map(([id, rec]) => [+id, rec]).filter(([id]) => id !== v.me);
    const consistent = hands => passRecs.every(([id, rec]) => {
      const c = L.ctxOf({ rules: v.rules, revolution: rec.revolution, elevenBack: rec.elevenBack, field: rec.field });
      return L.legalPlays(hands[id] || [], c).length === 0;
    });
    let exactSet = null;
    if (cfg.exactMax) {
      const alive = v.others.filter(o => !o.finished);
      let tot = 1, rem = pool.length;
      for (const o of alive) { tot *= binom(rem, o.count); rem -= o.count; if (tot > cfg.exactMax) break; }
      if (rem === 0 && tot <= cfg.exactMax) {
        const all = [];
        const en = (ai, avail, cur) => {
          if (ai === alive.length) {
            const h = {}; v.others.forEach(o => { h[o.id] = []; }); cur.forEach(([id, cs]) => { h[id] = cs; });
            if (consistent(h)) all.push(h);
            return;
          }
          for (const sub of kSubsets(avail, alive[ai].count)) en(ai + 1, avail.filter(c => !sub.includes(c)), cur.concat([[alive[ai].id, sub]]));
        };
        en(0, pool, []);
        if (all.length) exactSet = all;
      }
    }
    const sampleHands = () => {
      if (exactSet) return exactSet[Math.floor(Math.random() * exactSet.length)];
      let h = dealWeighted(pool, v.others, tilt);
      for (let t = 0; t < 40 && !consistent(h); t++) h = dealWeighted(pool, v.others, tilt);
      return h;
    };
    const makeState = hands => ({
      players: Array.from({ length: n }, (_, id) => {
        const o = id === v.me ? null : v.others.find(x => x.id === id);
        return { id, name: '', isHuman: false, level: '普通', role: null, rank: null,
          hand: id === v.me ? v.hand.slice() : hands[id].slice(), finished: o ? !!o.finished : false };
      }),
      rules: v.rules, revolution: v.revolution, elevenBack: v.elevenBack, revCount: 0,
      field: v.fieldObj ? { ...v.fieldObj, cards: v.fieldObj.cards.slice() } : null,
      passed: v.passed.slice(), turn: v.me, finishOrder: v.finishOrder.slice(), over: false,
      phase: 'play', played: v.played.slice(), hist: (v.hist || []).slice(), exchanges: [], pendingSeven: null, pendingDiscard: null,
      passRecord: { ...(v.passRec || {}) }, playId: 0, recorded: true, fallenId: null,
    });
    const rollout = st => {
      let steps = 0;
      while (!st.over && steps++ < (cfg.rolloutSteps || 220)) {
        if (st.players[v.me].finished) break;
        if (st.phase === 'seven') {
          const s = st.pendingSeven;
          if (!L.giveSevenCards(st, chooseSevenCards(st.players[s.from].hand, L.sevenNeed(st), L.ctxOf(st), cfg.policy)).ok) break;
          continue;
        }
        if (st.phase === 'discard') {
          const d = st.pendingDiscard;
          if (!L.discardCards(st, d.from, chooseDiscard(st.players[d.from].hand, L.discardNeed(st, d.from), L.ctxOf(st), cfg.policy)).ok) break;
          continue;
        }
        if (st.phase !== 'play') break;
        if (L.stuckCheck(st) || st.over) continue;
        const idx = st.turn;
        if (st.players[idx].finished) break;
        const choice = choosePlay(view(st, idx), cfg.policy);
        if (!choice) { if (!L.applyPass(st, idx).ok) break; }
        else if (!L.applyPlay(st, idx, choice.cards, choice.rev ? 'rev' : 'normal').ok) break;
      }
      return st;
    };
    const rankOf = st => {
      const me = st.players[v.me];
      if (me.rank != null) return me.rank;
      if (!cfg.leafEval || st.over) return n;
      const c = L.ctxOf(st);
      const fin = st.players.filter(p => p.finished).length;
      const myEst = finishEstimate(me.hand, c);
      let ahead = 0;
      st.players.forEach(p => { if (p.id !== v.me && !p.finished && finishEstimate(p.hand, c) < myEst) ahead++; });
      return Math.min(n, fin + 1 + ahead);
    };
    const rewardOf = st => { const rk = rankOf(st); return (n - rk) / (n - 1) - (rk === n ? bottomW : 0); };
    const tree = new Map();
    const prefs = new Map(); // 木の各節で、強いの考え方が選ぶ手（事前評価）
    const nodeFor = k => { let m = tree.get(k); if (!m) { m = new Map(); tree.set(k, m); } return m; };
    const legalActs = st => {
      const acts = L.legalPlays(st.players[st.turn].hand, L.ctxOf(st)).map(x => ({ cards: x.cards, rev: x.rev, key: actKey(x.cards, x.rev) }));
      if (st.field) acts.push({ cards: null, rev: false, key: 'pass' });
      return acts;
    };
    const applyAct = (st, idx, a) => (a.cards ? L.applyPlay(st, idx, a.cards, a.rev ? 'rev' : 'normal') : L.applyPass(st, idx)).ok;
    const C = cfg.C !== undefined ? cfg.C : 0.6;
    const pickUcb = (node, acts, pref) => {
      const untried = acts.filter(a => !node.has(a.key));
      if (untried.length) { const pu = untried.find(a => a.key === pref); return { a: pu || rnd(untried), fresh: true }; }
      let total = 0;
      acts.forEach(a => { total += node.get(a.key).N; });
      let best = null, bs = -Infinity;
      for (const a of acts) {
        const s = node.get(a.key);
        const sc = s.W / s.N + C * Math.sqrt(Math.log(total + 1) / s.N) + (cfg.priorW && a.key === pref ? cfg.priorW / (s.N + 1) : 0);
        if (sc > bs) { bs = sc; best = a; }
      }
      return { a: best, fresh: false };
    };
    const rootActs = capItems(items, cfg.maxCandidates).map(x => ({ item: x, key: actKey(x.cards, x.rev) }));
    if (!lead) rootActs.push({ item: null, cards: null, rev: false, key: 'pass' });
    const root = nodeFor('R');
    let iters = 0, lastYield = Date.now();
    if (rootActs.length === 1) return rootActs[0].item; // 選択肢が1つなら探索しない
    while (iters < cfg.maxIters && (iters < 60 || Date.now() < deadline)) {
      iters++;
      if (Date.now() - lastYield > 8) { yield; lastYield = Date.now(); }
      const st = makeState(sampleHands());
      const path = [];
      if (cfg.priorW && !prefs.has('R')) { const pk = choosePlay(view(st, v.me), cfg.policy); prefs.set('R', pk ? actKey(pk.cards, pk.rev) : 'pass'); }
      const sel = pickUcb(root, rootActs, prefs.get('R'));
      if (sel.fresh) root.set(sel.a.key, { N: 0, W: 0 });
      const ra = sel.a.item !== undefined ? { cards: sel.a.item ? sel.a.item.cards : null, rev: sel.a.item ? sel.a.item.rev : false, key: sel.a.key } : sel.a;
      if (!applyAct(st, v.me, ra)) continue;
      path.push(['R', ra.key]);
      let key = 'R|' + ra.key, depth = 0;
      while (!st.over && st.phase === 'play' && depth < cfg.treeDepth) {
        if (st.players[st.turn].finished) break;
        const acts = legalActs(st);
        if (!acts.length) break;
        const node = nodeFor(key);
        if (cfg.priorW && !prefs.has(key)) { const pk = choosePlay(view(st, st.turn), cfg.policy); prefs.set(key, pk ? actKey(pk.cards, pk.rev) : 'pass'); }
        const s2 = pickUcb(node, acts, prefs.get(key));
        if (s2.fresh) node.set(s2.a.key, { N: 0, W: 0 });
        path.push([key, s2.a.key]);
        if (!applyAct(st, st.turn, s2.a)) break;
        if (s2.fresh) break;
        key += '|' + s2.a.key; depth++;
      }
      const r = rewardOf(rollout(st));
      for (const [k, ak] of path) { const s = nodeFor(k).get(ak); if (s) { s.N++; s.W += r; } }
    }
    // 最終判断：平均の成績から、手札の残りの見積もり（少ないほど良い）を引く
    let best = null, bestScore = -Infinity;
    for (const a of rootActs) {
      const s = root.get(a.key);
      if (!s || !s.N) continue;
      const remain = a.item ? v.hand.filter(c => !a.item.cards.some(d => d.id === c.id)) : v.hand;
      const score = s.W / s.N - 0.018 * finishEstimate(remain, ctx);
      if (score > bestScore) { bestScore = score; best = a; }
    }
    if (!best) best = rootActs[0];
    return best && best.item ? best.item : null;
  }
  // 非同期：画面の操作を止めないよう、少しずつ計算して結果を渡す
  function choosePlayAsync(v, level, cb) {
    if (level !== '圧倒的に強い') { cb(choosePlay(v, level)); return; }
    const ctx = ctxOf(v);
    const plays = L.legalPlays(v.hand, ctx);
    if (!plays.length) { cb(null); return; }
    const gen = ovGen(v, ctx, playItems(v, ctx, plays), !v.field, MC_CFG[level]);
    const step = () => {
      const t = Date.now();
      for (;;) {
        const r = gen.next();
        if (r.done) { cb(r.value ? { cards: r.value.cards, rev: r.value.rev } : null); return; }
        if (Date.now() - t > 12) break;
      }
      setTimeout(step, 0);
    };
    step();
  }

  // 戻り値: {cards, rev} または null（パス）
  function playItems(v, ctx, plays) {
    return plays.map(x => ({
      cards: x.cards, rev: x.rev, n: x.cards.length,
      p: L.playInfo(x.cards, ctx, x.rev ? 'rev' : 'normal').power,
      flush: flushes(x.cards, v.rules, x.rev),
      ext: reduceExtra(x.cards, v),
      revMake: makesRevolution(x, ctx),
    }));
  }
  function choosePlay(v, level) {
    const ctx = ctxOf(v);
    const plays = L.legalPlays(v.hand, ctx);
    if (!plays.length) return null;
    const lead = !v.field;
    const items = playItems(v, ctx, plays);
    let pick = null;
    if (level === '圧倒的に強い') {
      pick = runSync(ovGen(v, ctx, items, lead, MC_CFG[level]));
      return pick ? { cards: pick.cards, rev: pick.rev } : null;
    }
    if (level === '圧倒的に弱い') {
      // 戦略がなく、目先の1手だけで決める。場があれば気まぐれにパスし、場が空なら一番強い手を出す（強い札を早く使う）
      if (lead) { const singles = items.filter(x => x.n === 1); pick = (singles.length ? singles : items).slice().sort((a, b) => b.p - a.p)[0]; }
      else pick = Math.random() < 0.8 ? null : items.slice().sort((a, b) => b.p - a.p)[0];
    } else if (level === 'とても弱い') {
      // 出す手も、パスも、ほぼ無作為
      pick = (!lead && Math.random() < 0.4) ? null : rnd(items);
    } else if (level === '弱い') {
      pick = (!lead && Math.random() < 0.2) ? null : rnd(items);
    } else if (level === '普通') {
      const normals = items.filter(x => !x.rev);
      if (lead) {
        const pool = normals.length ? normals : items;
        pool.sort((a, b) => (a.p - a.n * 2) - (b.p - b.n * 2));
        pick = pool[0];
      } else {
        normals.sort((a, b) => a.p - b.p);
        if (normals.length && !(normals[0].p >= 15 && v.hand.length > 3)) pick = normals[0];
      }
    } else if (level === '極めて弱い') {
      // 場に出せるときは7割パスする。出すときは出せる中で一番強い手を出す（強い札を無駄に切る）。親のときは一番強い1枚を出す
      const byPower = items.slice().sort((a, b) => b.p - a.p);
      if (!lead && Math.random() < 0.7) pick = null;
      else pick = lead ? (byPower.find(x => x.n === 1) || byPower[0]) : byPower[0];
    } else if (level === 'とても強い' || level === '極めて強い') {
      pick = mcPick(v, ctx, items, lead, MC_CFG[level]);
    } else {
      pick = strongPick(v, ctx, items, lead);
    }
    if (!pick && lead) pick = items[0];
    return pick ? { cards: pick.cards, rev: pick.rev } : null;
  }

  // 手札を「残したい価値」の順に並べる（弱い札が先頭。組は残す。ジョーカーは最後）
  const keepOrder = (hand, ctx, level) => {
    const sib = c => hand.filter(x => x.num === c.num).length;
    const keepSets = level === '強い' || level === 'とても強い' || level === '極めて強い' || level === '圧倒的に強い';
    if (level === '極めて弱い' || level === '圧倒的に弱い') return hand.slice().sort((a, b) => L.cardPower(b, ctx) - L.cardPower(a, ctx));
    const cost = c => L.cardPower(c, ctx) + (keepSets ? (sib(c) - 1) * 3 : 0);
    return hand.slice().sort((a, b) => cost(a) - cost(b));
  };

  // 7渡し：渡す札のid（とても弱いは無作為、それ以外は残したい札を残す）
  function chooseSevenCards(hand, count, ctx, level) {
    if (level === 'とても弱い') return L.shuffle(hand.slice()).slice(0, count).map(c => c.id);
    return keepOrder(hand, ctx, level).slice(0, count).map(c => c.id);
  }

  // 戻り値: 返す札の配列
  function chooseReturn(hand, count, level, ctx) {
    if (level === 'とても弱い' || level === '弱い') {
      // 弱い札から返す。ジョーカーは最強なので、返す札は最後に回す
      const nj = L.shuffle(hand.filter(c => !L.isJoker(c)));
      return nj.concat(hand.filter(c => L.isJoker(c))).slice(0, count);
    }
    if (level === '圧倒的に弱い' || level === '極めて弱い') return keepOrder(hand, ctx, level).slice(0, count);
    // 強い以上：ジョーカーは手元に残し、弱い札から返す
    const nonJ = hand.filter(c => !L.isJoker(c));
    const pool = nonJ.length >= count ? nonJ : hand;
    return keepOrder(pool, ctx, level).slice(0, count);
  }
  // 10捨て：弱い札から順に捨てる（ジョーカーは最後）。戻り値: 捨てる札のid
  function chooseDiscard(hand, count, ctx, level) {
    if (level === 'とても弱い') return L.shuffle(hand.slice()).slice(0, count).map(c => c.id);
    return keepOrder(hand, ctx, level).slice(0, count).map(c => c.id);
  }
  return { view, choosePlay, choosePlayAsync, chooseSevenCards, chooseReturn, chooseDiscard };
})();

  if (num === 14) return `<span class="pp big">${s}</span>`;   // A

  return PIP_POS[value].map(([x, y]) =>
    `<span class="pp${y > 50 ? ' flip' : ''}${value >= 9 ? ' dense' : ''}" style="left:${x}%;top:${y}%">${s}</span>`).join('');

function cardHTML(c, o = {}) {
  if (!c || o.back) return '<div class="card back"></div>';
  const cls = ['card'];
  let body;
  if (c.num === 16) {
    cls.push('joker');
    body = '<div class="jt"><b>JOKER</b></div>';
  } else {
    const red = c.suit === 'H' || c.suit === 'D';
    cls.push(red ? 'red' : 'black');
    const L = Logic.label(c.num), s = Logic.SUIT_SYM[c.suit] + '\uFE0E';
    const corners = `<span class="ix tl">${L}<small>${s}</small></span><span class="ix br">${L}<small>${s}</small></span>`;
    const mid = (c.num >= 11 && c.num <= 13)
      ? `<div class="panel"><i>${s}</i></div>`
      : pipsHTML(c.num, s);
    body = corners + mid;
  }
  if (o.sel) cls.push('sel');
  if (o.dim) cls.push('dim');
  if (o.hint) cls.push('hint');
  return `<div class="${cls.join(' ')}" data-cid="${c.id}">${body}</div>`;
}

function sortCards(g, arr) {
  const ctx = Logic.ctxOf(g);
  const SO = { S: 0, H: 1, D: 2, C: 3, X: 4 };
  const a = arr.slice();
  if (UI.sortMode === 'num') a.sort((x, y) => Logic.cardPower(x, ctx) - Logic.cardPower(y, ctx) || SO[x.suit] - SO[y.suit]);
  else a.sort((x, y) => SO[x.suit] - SO[y.suit] || Logic.cardPower(x, ctx) - Logic.cardPower(y, ctx));
  return a;
}

function addMsg(t) { UI.messages.push(t); if (UI.messages.length > 6) UI.messages.shift(); }
let telopTimer = null;

const FX_TYPES = ['play', 'pass', 'flush', 'eight', 'ten', 'discard', 'eleven', 'revolution', 'stairRev', 'sevenStart', 'give', 'spade3', 'finish'];
function announce(g, e) {

    case 'pass': addMsg(`${nm(e.idx)}：パス`); break;

    case 'eleven': addMsg('11バック！'); break;
    case 'revolution': addMsg(e.on ? '革命！' : '革命返し！'); break;

    case 'give': addMsg(`${nm(e.from)}が${nm(e.to)}に札を渡しました`); break;

/* ---------- 演出（テロップ・エフェクト・札の移動） ---------- */
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function seatEl(pid) { return document.querySelector(`[data-pid="${pid}"]`); }
// 札を席から飛ばす。faces があれば表向き（10捨て）、なければ裏向き（7渡し）
function flyCards(fromPid, toEl, n, faces) {
  const fromEl = seatEl(fromPid);
  if (reduceMotion() || !fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const list = faces && faces.length ? faces.slice(0, 5) : Array.from({ length: Math.max(1, Math.min(n || 1, 5)) }, () => null);
  list.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'flyer';
    d.innerHTML = c ? cardHTML(c) : '<div class="card back"></div>';
    document.body.appendChild(d);
    const w = d.offsetWidth || 40, h = d.offsetHeight || 60;
    const sx = a.left + a.width / 2 - w / 2, sy = a.top + a.height / 2 - h / 2;
    const dx = b.left + b.width / 2 - w / 2 - sx, dy = b.top + b.height / 2 - h / 2 - sy;
    d.style.left = sx + 'px'; d.style.top = sy + 'px';
    const anim = d.animate([
      { transform: 'translate(0,0)', opacity: 0 },
      { opacity: 1, offset: 0.15 },
      { transform: `translate(${dx}px,${dy}px)`, opacity: 1, offset: 0.85 },
      { transform: `translate(${dx}px,${dy}px)`, opacity: 0 },
    ], { duration: 950, delay: i * 90, easing: 'ease-in-out', fill: 'both' });
    anim.onfinish = () => d.remove();
  });
}
function fxOne(g, e) {
  switch (e.type) {
    case 'play': Sound.play(e.len || (e.cards && e.cards.length) || 1); break;
    case 'pass': Sound.pass(); break;
    case 'flush': telop('場が流れました'); setTimeout(() => Sound.sweep(), 150); break;
    case 'eight': telop('8切り！'); setTimeout(() => Sound.sweep(), 150); break;
    case 'ten': telop('10捨て！'); break;
    case 'discard': flyCards(e.idx, $('#field'), e.n, e.cards); Sound.slide(e.n); break;
    case 'eleven': telop('11バック！'); setTimeout(() => Sound.flip(), 140); break;
    case 'revolution': telop(e.on ? '革命！' : '革命返し！'); setTimeout(() => Sound.flip(), 140); break;
    case 'stairRev': telop('階段革命！'); setTimeout(() => Sound.flip(), 140); break;
    case 'sevenStart': telop('7渡し！'); break;
    case 'give': flyCards(e.from, seatEl(e.to), e.n); Sound.slide(e.n); break;
    case 'spade3': telop('スペードの3！'); setTimeout(() => Sound.flip(), 140); break;
    case 'finish': telop(`${g.players[e.idx].name} ${e.rank}位上がり`); Sound.finish(); break;
  }
}
function playFx(g, events) { if (g) events.forEach(e => fxOne(g, e)); }
function afterAction(g, events) {

  UI.fxSeq++;

  runFlow();
  playFx(g, UI.fxEvents);
}
function runFlow() {
  const g = UI.game;
  if (!g) return;
  const who = g.players[g.turn];
  if (g.phase === 'play' && who && !who.finished && Logic.stuckCheck(g)) {
    addMsg(`${who.name}は上がれるカードがなく、最後まで残ります`);
    runFlow();
    return;
  }
  if (g.over) {
    recordGame(g);
    netBroadcast();
    renderAll();
    openResult();
    return;
  }
  netBroadcast();
  renderAll();
  if (g.phase === 'exchange') { handleExchange(); return; }
  if (g.phase === 'discard') {
    const from = g.players[g.pendingDiscard.from];
    if (from.id === UI.myId) { if (UI.overlay !== 'discard') openDiscard(); }
    else if (!from.isHuman) {
      clearTimeout(UI.timer);
      UI.timer = setTimeout(() => cpuDiscard(g), 500);
    }
    return;
  }
  if (g.phase === 'seven') {
    const from = g.players[g.pendingSeven.from];
    if (from.id === UI.myId) { if (UI.overlay !== 'seven') openSeven(); }
    else if (!from.isHuman) {
      clearTimeout(UI.timer);
      UI.timer = setTimeout(() => cpuSeven(g), 500);
    }
    return;
  }
  const cur = g.players[g.turn];
  if (!cur.isHuman) {
    clearTimeout(UI.timer);
    const delay = { '圧倒的に弱い': 800, '極めて弱い': 1100, 'とても弱い': 1000, '弱い': 900, '普通': 750, '強い': 600, 'とても強い': 450, '極めて強い': 450, '圧倒的に強い': 450 }[cur.level] || 750;
    UI.timer = setTimeout(() => cpuTurn(g), delay);
  }
}
function cpuTurn(g) {
  if (UI.game !== g || g.over || g.phase !== 'play') return;
  const idx = g.turn, p = g.players[idx];
  if (p.isHuman) return;
  // 思考は非同期（画面の操作を止めない）。途中で別の操作があれば結果は捨てる
  const token = (UI.cpuToken = {});
  CPU.choosePlayAsync(CPU.view(g, idx), p.level, choice => {
    if (UI.cpuToken !== token || UI.game !== g || g.over || g.phase !== 'play' || g.turn !== idx) return;
    let res = choice ? Logic.applyPlay(g, idx, choice.cards, choice.rev ? 'rev' : 'normal') : Logic.applyPass(g, idx);
    if (!res.ok && g.field) res = Logic.applyPass(g, idx);

  });
}
function cpuSeven(g) {
  if (UI.game !== g || g.phase !== 'seven') return;
  const s = g.pendingSeven, p = g.players[s.from];
  const res = Logic.giveSevenCards(g, CPU.chooseSevenCards(p.hand, Logic.sevenNeed(g), Logic.ctxOf(g), p.level));

    <div class="hand exh" id="exHand">${sortCards(g, from.hand).map(c => cardHTML(c, { sel: UI.discSel.has(c.id) })).join('')}</div>
    <div class="row"><span>選択 ${UI.discSel.size}/${need}</span>

function humanPlay() {

/* ---------- 大富豪交換 ---------- */
function handleExchange() {
  const g = UI.game;
  const ex = Logic.pendingExchange(g);
  if (!ex) return;
  const giver = g.players[ex.giver], recv = g.players[ex.receiver];
  if (ex.stage === 'give') {
    // 「交換の札を自分で選ぶ」ONで受け取る側が人間なら、その人が渡す側の手札から選ぶ
    if (recv.isHuman && g.rules.exchangeChoose) {
      if (recv.id === UI.myId && UI.overlay !== 'exchange') openExchange(ex, 'take');
      return;
    }
    clearTimeout(UI.timer);
    UI.timer = setTimeout(() => {
      if (UI.game !== g) return;
      const e2 = Logic.pendingExchange(g);
      if (!e2 || e2.stage !== 'give') return;
      const gv = g.players[e2.giver], rv = g.players[e2.receiver];
      Logic.exchangeGive(g, e2, Logic.pickStrongest(gv.hand, e2.count, Logic.ctxOf(g)));
      Sound.slide(e2.count);
      addMsg(`${gv.name}が${rv.name}に札を渡しました（交換）`);
      runFlow();
    }, giver.isHuman ? 0 : 600);
    return;
  }
  if (recv.isHuman) {
    if (recv.id === UI.myId && UI.overlay !== 'exchange') openExchange(ex, 'return');
    return;
  }
  clearTimeout(UI.timer);
  UI.timer = setTimeout(() => {
    if (UI.game !== g) return;
    const e2 = Logic.pendingExchange(g);
    if (!e2 || e2.stage !== 'return') return;
    const rv = g.players[e2.receiver], gv = g.players[e2.giver];
    const cards = CPU.chooseReturn(rv.hand, e2.count, rv.level, Logic.ctxOf(g));
    Logic.exchangeReturn(g, e2, cards);
    Sound.slide(cards.length);
    addMsg(`${rv.name}が${gv.name}に${cards.length}枚を返しました`);
    runFlow();
  }, 700);
}
const exWho = (g, ex) => g.players[UI.exMode === 'return' ? ex.receiver : ex.giver];
function openExchange(ex, mode) {
