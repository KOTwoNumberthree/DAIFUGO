<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大富豪</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);display:flex;justify-content:center;min-height:100dvh;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
#app{width:100%;max-width:430px;min-height:100dvh;display:flex;flex-direction:column;background:var(--table);position:relative;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,.45)}
.hidden{display:none!important}

/* ---------- テーマ（CSS変数） ---------- */
body[data-theme=casino]{
  --font:'Hiragino Mincho ProN','Yu Mincho',serif;
  --bg:#082015;
  --table:radial-gradient(ellipse at 50% 35%,#267c4f 0%,#16573a 55%,#0b3121 100%);
  --panel:rgba(8,30,20,.72);--panel-solid:#123d29;--text:#f7e9be;
  --accent:#e9c35f;--accent2:#fff1c2;
  --btn-bg:linear-gradient(#f2d17a,#b8862f);--btn-fg:#2b1b04;--btn-bd:#6e4c12;
  --card-face:linear-gradient(160deg,#fffdf7,#f0e4c6);--ink-r:#b5162f;--ink-b:#161616;
  --joker:linear-gradient(135deg,#f0cf6a,#7d3c97 50%,#2c6fb6);
  --radius:8px;--btnr:12px;--frame:#8a6428;
  --back:repeating-linear-gradient(45deg,rgba(255,220,140,.28) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(255,220,140,.28) 0 2px,transparent 2px 9px),linear-gradient(#8c1a2c,#5e0f1d);
  --shadow:0 6px 14px rgba(0,0,0,.45);
}
body[data-theme=wafu]{
  --font:'Hiragino Mincho ProN','Yu Mincho',serif;
  --bg:#0e1230;
  --table:radial-gradient(circle at 50% 0%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),linear-gradient(170deg,#1f2a5e,#121837 70%);
  --panel:rgba(12,16,44,.7);--panel-solid:#171f48;--text:#f3ead2;
  --accent:#d9b44a;--accent2:#ff6b5a;
  --btn-bg:linear-gradient(#c8283a,#7e1020);--btn-fg:#fff6e6;--btn-bd:#d9b44a;
  --card-face:linear-gradient(#fbf6e9,#eadfc2);--ink-r:#b8262c;--ink-b:#1d1d24;
  --joker:linear-gradient(135deg,#e4483d,#d9b44a);
  --radius:4px;--btnr:4px;--frame:#4d5a92;
  --back:radial-gradient(circle at 50% 100%,transparent 38%,#d9b44a 40%,transparent 43%) 0 0/22px 22px,radial-gradient(circle at 50% 100%,transparent 38%,#d9b44a 40%,transparent 43%) 11px 11px/22px 22px,#1d2a5f;
  --shadow:0 6px 12px rgba(0,0,0,.4);
}
body[data-theme=neon]{
  --font:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --bg:#04000a;
  --table:radial-gradient(ellipse at 50% 0%,#3a0f66 0%,#12052e 45%,#05000d 100%);
  --panel:rgba(20,6,40,.7);--panel-solid:#14082c;--text:#e6f7ff;
  --accent:#ff2bd6;--accent2:#00f0ff;
  --btn-bg:rgba(0,240,255,.1);--btn-fg:#00f0ff;--btn-bd:#00f0ff;
  --card-face:linear-gradient(160deg,#1f1438,#0e0a1f);--ink-r:#ff3d8a;--ink-b:#cfd8ff;
  --joker:linear-gradient(135deg,#ff2bd6,#00f0ff);
  --radius:6px;--btnr:10px;--frame:#00f0ff;
  --back:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,240,255,.45) 6px 7px),repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,43,214,.3) 6px 7px),#0b0520;
  --shadow:0 0 14px rgba(0,240,255,.25),0 8px 16px rgba(0,0,0,.5);
}
body[data-theme=forest]{
  --font:'Hiragino Maru Gothic ProN','BIZ UDPGothic','Hiragino Sans',sans-serif;
  --bg:#2b3a22;
  --table:repeating-linear-gradient(90deg,rgba(90,52,20,.18) 0 2px,transparent 2px 13px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 9px),linear-gradient(180deg,#9a6a3a,#7a4f2a 55%,#8a5d31);
  --panel:rgba(40,30,15,.55);--panel-solid:#3b2c17;--text:#fbf6e6;
  --accent:#a8d86e;--accent2:#f7e27a;
  --btn-bg:linear-gradient(#b7e38f,#6fae4a);--btn-fg:#1b2d0e;--btn-bd:#3f6d24;
  --card-face:linear-gradient(#fdfbf1,#ecf2da);--ink-r:#c2452f;--ink-b:#3b3b2c;
  --joker:linear-gradient(135deg,#a8d86e,#f7e27a);
  --radius:14px;--btnr:18px;--frame:#4c6b33;
  --back:repeating-linear-gradient(0deg,#6e9a4f 0 6px,#5a8340 6px 12px);
  --shadow:0 6px 12px rgba(20,12,0,.4);
}

/* ---------- 共通部品 ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px}
.bar h1{font-size:18px;margin:0;letter-spacing:.12em;color:var(--accent)}
.bar-r{display:flex;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px;align-items:center}
.sel{min-height:44px;padding:0 8px;border-radius:var(--btnr);background:var(--panel);border:1.5px solid var(--frame)}
.btn{min-width:44px;min-height:44px;padding:8px 14px;border-radius:var(--btnr);background:var(--btn-bg);color:var(--btn-fg);border:1.5px solid var(--btn-bd);font-weight:700;cursor:pointer;box-shadow:var(--shadow);touch-action:manipulation;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{flex:1;font-size:17px;min-height:48px}
.btn.small{font-size:13px;padding:6px 10px;min-height:40px}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none}
.btn.on{outline:3px solid var(--accent2)}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.small{font-size:12px;opacity:.85}
.empty{opacity:.75;font-size:14px;text-align:center;padding:10px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.14);margin-left:4px}
.tag.gold{background:var(--accent);color:#2a1a05}
.role{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent);color:#2a1a05;font-weight:700}
.role.r4{background:#e9b9a5}.role.r5{background:#8a1f1f;color:#fff}
.b{display:inline-block;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--frame);margin:2px}
.b.hot{background:var(--ink-r);color:#fff;border-color:var(--ink-r)}
.badges{padding:0 10px 4px;display:flex;flex-wrap:wrap}
.status{margin:6px 10px;padding:8px 12px;background:var(--panel);border-radius:12px;font-size:14px;min-height:50px;border:1px solid var(--frame)}
.log{font-size:12px;opacity:.85;margin-top:3px}
.ok{color:var(--accent2);font-weight:700}
.ng{color:#ff8a7a;font-weight:700}
.modebar{display:flex;gap:8px;padding:0 12px 6px;justify-content:center;flex-wrap:wrap}
.modebar:empty{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:70;max-width:90%;text-align:center}
.telop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:16px;background:rgba(0,0,0,.72);color:var(--accent2);font-size:26px;font-weight:700;letter-spacing:.08em;white-space:nowrap;z-index:60;pointer-events:none;animation:telop 1s ease forwards;text-shadow:0 0 12px var(--accent)}
.overlay:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{width:100%;max-width:400px;max-height:88dvh;overflow:auto;background:var(--panel-solid);color:var(--text);border:1.5px solid var(--accent);border-radius:16px;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.modal h2{margin:0 0 10px;font-size:20px;color:var(--accent)}
.modal h3{margin:6px 0 4px;font-size:15px}
.modal p{margin:4px 0 8px;font-size:14px;line-height:1.6}
.rs{padding:8px 10px;border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.04)}
.rs.on{background:rgba(255,255,255,.12);outline:1px solid var(--accent)}
.tablewrap{overflow-x:auto}
table.board{width:100%;border-collapse:collapse;font-size:13px}
table.board th,table.board td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.14);text-align:center;white-space:nowrap}
table.board td:first-child{text-align:left}
.form{display:flex;flex-direction:column;gap:12px;padding:12px 14px 28px;overflow-y:auto}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.txt{min-height:44px;padding:8px 12px;border-radius:var(--btnr);border:1.5px solid var(--frame);background:var(--panel);width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.cpu-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;background:var(--panel);padding:6px 10px;border-radius:12px;border:1px solid var(--frame)}
.rule{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border-radius:12px;border:1px solid var(--frame);min-height:52px;font-size:14px}
.rule input{width:24px;height:24px;flex:none}
.rule small{display:block;opacity:.8;font-size:12px;margin-top:2px}
.rule.dis{opacity:.45}
.code{height:84px;font-size:11px;word-break:break-all;resize:none}

.title-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px 20px;text-align:center}
.title-screen .btn.big{flex:none;width:270px;max-width:100%;min-height:52px;white-space:nowrap}
.logo{font-size:44px;font-weight:700;letter-spacing:.2em;color:var(--accent);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.fan{position:relative;width:170px;height:120px}
.fan .card{position:absolute;left:57px;top:8px}
.fan .card:nth-child(1){transform:translateX(-42px) rotate(-18deg)}
.fan .card:nth-child(2){transform:rotate(0deg)}
.fan .card:nth-child(3){transform:translateX(42px) rotate(18deg)}

/* ---------- カード ---------- */
.card{position:relative;isolation:isolate;flex:none;width:56px;height:80px;border-radius:var(--radius);background:var(--card-face);color:var(--ink-b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 -3px 0 rgba(0,0,0,.08),0 2px 2px rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.35);transition:transform .15s ease,filter .15s,box-shadow .15s;user-select:none;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--paper-tex)}
.card.red{color:var(--ink-r)}
/* 札の表面の質感（全ての札・テーマ共通） */
:root{--paper-tex:radial-gradient(circle at 30% 18%,rgba(255,255,255,.75),transparent 55%),repeating-linear-gradient(35deg,rgba(90,60,20,.03) 0 1px,transparent 1px 4px)}
.card .ix{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;font-size:12px;z-index:2}
.card .tl{top:4px;left:4px}
.card .br{bottom:4px;right:4px;transform:rotate(180deg)}
.card .ix small{font-size:10px;margin-top:1px}
.card .pp{position:absolute;transform:translate(-50%,-50%);font-size:13px;line-height:1;z-index:1;text-shadow:0 1px 0 rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.2)}
.card .pp.flip{transform:translate(-50%,-50%) rotate(180deg)}
.card .pp.dense{font-size:11px}
.card .pp.big{left:50%;top:50%;font-size:30px}
.card .panel{position:absolute;left:8px;right:8px;top:22px;bottom:22px;border:1.5px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1}
.card .panel i{font-style:normal;font-size:26px;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.2)}
.card .jt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}

<body data-theme="casino">
<div id="app"></div>
<div id="overlay" class="overlay hidden"></div>
<div id="telop" class="telop hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =====================================================================
 * 1. ゲームロジック（DOM非依存の純粋な関数群）
 *    ルール判定・状態遷移はすべてここで行う。UIは状態を描画するだけ。
 * ===================================================================== */
const Logic = (() => {
  const SUITS = ['S', 'H', 'D', 'C'];
  const SUIT_SYM = { S: '♠', H: '♥', D: '♦', C: '♣', X: '★' };
  const JOKER = 16;
  const LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2' };
  const ROLE_NAMES = ['大富豪', '富豪', '平民', '貧民', '大貧民'];

  const label = n => LABEL[n] || String(n);
  const isJoker = c => c.num === JOKER;
  const fail = reason => ({ ok: false, reason });
  const removeCards = (hand, cards) => { const ids = new Set(cards.map(c => c.id)); return hand.filter(c => !ids.has(c.id)); };
  const kindText = (kind, len, rev) => rev ? `${len}枚の階段革命`
    : kind === 'stair' ? `${len}枚の階段` : len === 1 ? '1枚' : `${len}枚の組`;

  function createDeck() {
    const deck = []; let id = 0;
    for (const s of SUITS) for (let n = 3; n <= 15; n++) deck.push({ id: id++, suit: s, num: n });
    deck.push({ id: id++, suit: 'X', num: JOKER }, { id: id++, suit: 'X', num: JOKER });
    return deck;
  }
  function shuffle(a, rng = Math.random) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function dealHands(n) {
    const d = shuffle(createDeck());
    const hands = Array.from({ length: n }, () => []);
    d.forEach((c, i) => hands[i % n].push(c));
    return hands;
  }
  function ctxOf(state) {
    return { rules: state.rules, revolution: state.revolution, elevenBack: state.elevenBack,
      field: state.field ? state.field.cards : null, fieldInfo: state.field };
  }
  // 実効的な強さ。革命と11バックの二重適用で元に戻る。ジョーカーは影響を受けない。
  function cardPower(c, ctx) {
    if (isJoker(c)) return 100;
    return (ctx.revolution !== ctx.elevenBack) ? 18 - c.num : c.num;
  }
  const numPower = (n, ctx) => cardPower({ suit: 'S', num: n }, ctx);
  // 階段の候補。ジョーカーは範囲の中で不足した数字を埋める（ワイルド）。候補は数字の範囲 {lo, hi}。
  function stairWindows(cards) {
    const nat = cards.filter(c => !isJoker(c));
    const L = cards.length;
    if (L < 3 || nat.length === 0) return [];
    const suit = nat[0].suit;
    if (nat.some(c => c.suit !== suit)) return [];
    const nums = nat.map(c => c.num);
    if (new Set(nums).size !== nums.length) return [];
    const out = [];
    for (let lo = 3; lo + L - 1 <= 15; lo++) {
      const hi = lo + L - 1;
      if (Math.min(...nums) >= lo && Math.max(...nums) <= hi) out.push({ lo, hi, suit });
    }
    return out;
  }
  function isStairShape(cards) { return stairWindows(cards).length > 0; }
  // 両方ONのときは mode で選ぶ。片方だけONならそれに従う。
  function resolveStairMode(mode, r) {
    if (r.stairs && r.stairRev) return mode;
    if (r.stairs) return 'normal';
    if (r.stairRev) return 'rev';
    return null;
  }
  // 手の種類判定（場の制約は含めない）。effNums はジョーカーを埋めた後の数字。
  function playInfo(cards, ctx, mode = 'normal') {
    const r = ctx.rules;
    if (!cards.length) return fail('札を選んでください');
    const nat = cards.filter(c => !isJoker(c));
    if (!r.wild && nat.length && nat.length < cards.length) return fail('ジョーカーは、ワイルドをONにしたときだけ数字の代わりに使えます');
    // 数字の組（ジョーカーは同じ数字に合わせて入る）
    if (!nat.length || nat.every(c => c.num === nat[0].num)) {
      if (mode === 'rev') return fail('階段革命は同じマークの連続4枚以上で出してください');
      if (!nat.length) return { ok: true, kind: 'set', len: cards.length, power: 100, rev: false, effNums: [] };
      return { ok: true, kind: 'set', len: cards.length, power: cardPower(nat[0], ctx), rev: false,
        effNums: Array(cards.length).fill(nat[0].num) };
    }
    if (cards.length < 3) return fail('2枚は同じ数字の組で出してください');
    if (new Set(nat.map(c => c.suit)).size > 1) return fail('階段は同じマークで出してください');
    const eff = resolveStairMode(mode, r);
    if (!eff) return fail('階段はOFFです。同じ数字の組で出してください');
    if (eff === 'rev' && cards.length < 4) return fail('階段革命は同じマークの連続4枚以上で出してください');
    const wins = stairWindows(cards);
    if (!wins.length) return fail('階段は連続する数字で出してください');
    let best = null;
    for (const w of wins) {
      let power = -Infinity;
      for (let n = w.lo; n <= w.hi; n++) power = Math.max(power, numPower(n, ctx));
      if (!best || power > best.power) best = { ...w, power };
    }
    const effNums = [];
    for (let n = best.lo; n <= best.hi; n++) effNums.push(n);
    return { ok: true, kind: 'stair', len: cards.length, power: best.power, rev: eff === 'rev', effNums };
  }
  // 場に対して出せるかの総合判定。場の情報は ctx.fieldInfo（kind, len, power, rev）。
  function evaluatePlay(cards, ctx, mode = 'normal') {
    const p = playInfo(cards, ctx, mode);
    if (!p.ok) return p;
    const f = ctx.field, fi = ctx.fieldInfo;
    // 場の札の強さは、今の順番（革命・11バックの状態）で計算し直す。保存された値は古い順番のことがあるため使わない。
    const fieldPower = f && f.length && fi ? (playInfo(f, ctx, fi.rev ? 'rev' : 'normal').power) : null;
    if (f && f.length && fi && fi.unbeatable) return fail('スペードの3には勝てません。この場は流れるまで誰も勝てません');
    if (ctx.rules.spade3Joker && f && f.length === 1 && isJoker(f[0]) && fi && !fi.rev && cards.length === 1 && isSpadeThree(cards[0]))
      return { ...p, unbeatable: true };
    if (p.rev) {
      // 階段革命は、場が空（自分のターン）か、同じ枚数でより強い階段革命のときだけ。場は流さない。
      if (!f || !f.length) return p;
      if (fi && fi.rev && fi.len === p.len && p.power > fieldPower) return p;
      return fail('階段革命は、場が空のときか、同じ枚数でより強い階段革命のときだけ出せます');
    }
    if (!f || !f.length) return p;
    if (fi.rev) return fail('場が階段革命です。同じ枚数の階段革命で応じてください');
    if (ctx.rules.bind) {
      const suits = new Set(f.filter(c => !isJoker(c)).map(c => c.suit));
      if (suits.size && cards.some(c => !isJoker(c) && !suits.has(c.suit)))
        return fail('しばり中です。場と同じマークの札を出してください');
    }
    if (p.kind !== fi.kind || p.len !== fi.len) return fail('場と同じ枚数・形の手で出してください');
    if (p.power <= fieldPower) return fail('場の札より強い札を出してください');
    return p;
  }
  function combos(arr, k) {
    const out = [];
    const rec = (start, cur) => {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    };
    rec(0, []);
    return out;
  }
  // 手札から出せる全ての手。{cards, rev} の配列（CPUとハイライトで使用）
  function legalPlays(hand, ctx) {
    const out = [];
    const add = cards => {
      const a = evaluatePlay(cards, ctx, 'normal');
      if (a.ok) out.push({ cards, rev: !!a.rev });
      if (ctx.rules.stairs && ctx.rules.stairRev && cards.length >= 4 && evaluatePlay(cards, ctx, 'rev').ok)
        out.push({ cards, rev: true });
    };
    const nat = hand.filter(c => !isJoker(c));
    const jokers = hand.filter(isJoker);
    // 数字の組（ワイルドONならジョーカーで不足分を埋める）
    const byNum = new Map();
    nat.forEach(c => { if (!byNum.has(c.num)) byNum.set(c.num, []); byNum.get(c.num).push(c); });
    for (const arr of byNum.values()) {
      for (let m = 1; m <= Math.min(arr.length, 4); m++) {
        combos(arr, m).forEach(base => {
          for (let jk = 0; jk <= Math.min(jokers.length, 4 - m); jk++) add(base.concat(jokers.slice(0, jk)));
        });
      }
    }
    for (let jk = 1; jk <= Math.min(jokers.length, 2); jk++) add(jokers.slice(0, jk));
    // 階段（同じマークの連続。抜けはジョーカーで埋める）
    if (ctx.rules.stairs || ctx.rules.stairRev) {
      for (const s of SUITS) for (let L = 3; L <= 13; L++) for (let lo = 3; lo + L - 1 <= 15; lo++) {
        const hi = lo + L - 1;
        const cs = nat.filter(c => c.suit === s && c.num >= lo && c.num <= hi);
        const need = L - cs.length;
        if (!cs.length || need > jokers.length) continue;
        add(cs.concat(jokers.slice(0, need)));
      }
    }
    return out.filter(x => !bansStrongFinish(x.cards, hand, ctx));
  }
  function pickStrongest(hand, count, ctx) {
    // ジョーカーも最強の札として扱う（強い順に並べるので、ジョーカーが先に選ばれる）
    return hand.slice().sort((a, b) => cardPower(b, ctx) - cardPower(a, ctx)).slice(0, count);
  }

  function roleForRank(rank, n) {
    if (n === 3) return ['大富豪', '平民', '大貧民'][rank - 1];
    if (rank === 1) return '大富豪';
    if (rank === 2) return '富豪';
    if (rank === n) return '大貧民';
    if (rank === n - 1) return '貧民';
    return '平民';
  }
  function leaderIndex(state) {
    // 「毎回大富豪から始める」がONで大富豪がいれば、その人から始める。それ以外は♦3の持ち主から。
    if (state.rules.richStart) {
      const rich = state.players.find(p => p.role === '大富豪');
      if (rich) return rich.id;
    }
    const p = state.players.find(p => p.hand.some(c => c.suit === 'D' && c.num === 3));
    return p ? p.id : 0;
  }
  function nextIndex(state, from) {
    const n = state.players.length;
    const owner = state.field ? state.field.owner : -1;
    for (let k = 1; k <= n; k++) {
      const i = (from + k) % n;
      const p = state.players[i];
      if (p.finished || state.passed[i] || i === owner) continue;
      return i;
    }
    return from;
  }
  // 7渡しの相手：出した人の次の席で、まだ上がっていないプレイヤー
  function nextSeat(state, from) {
    const n = state.players.length;
    for (let k = 1; k < n; k++) { const i = (from + k) % n; if (!state.players[i].finished) return i; }
    return null;
  }
  function sevenTargets(state, from) {
    const i = nextSeat(state, from);
    return i == null ? [] : [state.players[i]];
  }

  function startGame(series) {
    const n = series.players.length;
    const hands = dealHands(n);
    const players = series.players.map((p, i) => ({
      id: i, name: p.name, isHuman: p.isHuman, level: p.level,
      hand: hands[i], finished: false, rank: null, role: p.role || null,
    }));
    const state = {
      players, rules: { ...series.rules }, revolution: false, elevenBack: false, revCount: 0,
      field: null, passed: Array(n).fill(false), turn: 0, finishOrder: [], over: false,
      phase: 'play', played: [], exchanges: [], pendingSeven: null,
      playId: 0, recorded: false, fallenId: null, pendingDiscard: null,
    };
    if (series.rules.exchange && players.every(p => p.role)) {
      const pairs = [['大貧民', '大富豪', 2]];
      if (n >= 4) pairs.push(['貧民', '富豪', 1]);
      for (const [g, r, count] of pairs) {
        const giver = players.find(p => p.role === g), recv = players.find(p => p.role === r);
        if (!giver || !recv) continue;
        state.exchanges.push({ giver: giver.id, receiver: recv.id, count, stage: 'give', given: [], returned: [] });
      }
      if (state.exchanges.length) state.phase = 'exchange';
    }
    state.turn = leaderIndex(state);
    return state;
  }
  function pendingExchange(state) { return state.exchanges.find(e => e.stage !== 'done') || null; }
  function exchangeGive(state, ex, cards) {
    if (ex.stage !== 'give') return fail('交換の順番ではありません');
    const giver = state.players[ex.giver], recv = state.players[ex.receiver];
    if (cards.length !== ex.count) return fail(`${ex.count}枚選んでください`);
    if (new Set(cards.map(c => c.id)).size !== cards.length) return fail('同じ札は選べません');
    const ids = new Set(giver.hand.map(c => c.id));
    if (cards.some(c => !ids.has(c.id))) return fail('手札から選んでください');
    giver.hand = removeCards(giver.hand, cards);
    recv.hand = recv.hand.concat(cards);
    ex.given = cards.slice();
    ex.stage = 'return';
    return { ok: true };
  }
  function exchangeReturn(state, ex, cards) {
    if (ex.stage !== 'return') return fail('交換の順番ではありません');
    const giver = state.players[ex.giver], recv = state.players[ex.receiver];
    if (cards.length !== ex.count) return fail(`${ex.count}枚選んでください`);
    if (new Set(cards.map(c => c.id)).size !== cards.length) return fail('同じ札は選べません');
    const ids = new Set(recv.hand.map(c => c.id));
    if (cards.some(c => !ids.has(c.id))) return fail('手札から選んでください');
    recv.hand = removeCards(recv.hand, cards);
    giver.hand = giver.hand.concat(cards);
    ex.returned = cards.slice();
    ex.stage = 'done';
    if (!pendingExchange(state)) { state.phase = 'play'; state.turn = leaderIndex(state); }
    return { ok: true };
  }

  const isSpadeThree = c => c.suit === 'S' && c.num === 3;
  function isStrongest(c, ctx) {
    if (isJoker(c)) return true;
    if (ctx.rules.spade3Joker && isSpadeThree(c)) return true;
    const top = Math.max(...Array.from({ length: 13 }, (_, i) => numPower(i + 3, ctx)));
    return numPower(c.num, ctx) === top;
  }
  // ルール「最強の札で上がり禁止」がONのとき、最強の札を含み手札を出し切る手（上がり）は禁止
  const bansStrongFinish = (cards, hand, ctx) =>
    !!ctx.rules.noStrongFinish && cards.length === hand.length && cards.some(c => isStrongest(c, ctx));
  // 上がれないまま残った人を最下位にする（ゲーム終了時に順位を付ける）
  function finalizeStuck(state) {
    state.players.filter(p => p.stuck && p.rank == null).forEach(p => {
      p.rank = state.finishOrder.length + 1;
      state.finishOrder.push(p.id);
    });
  }
  // 自分の番で出せる手が1つもない（残りが上がり禁止の札だけ）なら、その人は上がれないまま残る
  function stuckCheck(state) {
    if (state.over || state.phase !== 'play' || state.field) return false;
    const p = state.players[state.turn];
    if (!p || p.finished || !p.hand.length) return false;
    if (legalPlays(p.hand, ctxOf(state)).length) return false;
    p.finished = true; p.stuck = true;
    const active = state.players.filter(x => !x.finished);
    if (active.length <= 1) {
      if (active.length === 1) {
        const last = active[0];
        last.finished = true; last.rank = state.finishOrder.length + 1; state.finishOrder.push(last.id);
      }
      state.over = true;
      finalizeStuck(state);
    } else state.turn = nextIndex(state, p.id);
    return true;
  }
  function finishPlayer(state, idx, ev) {
    const p = state.players[idx];
    p.finished = true;
    p.rank = state.finishOrder.length + 1;
    state.finishOrder.push(idx);
    ev.push({ type: 'finish', idx, rank: p.rank });
    const active = state.players.filter(x => !x.finished);
    if (active.length <= 1) {
      if (active.length === 1) {
        const last = active[0];
        last.finished = true;
        last.rank = state.finishOrder.length + 1;
        state.finishOrder.push(last.id);
        ev.push({ type: 'finish', idx: last.id, rank: last.rank });
      }
      state.over = true;
      finalizeStuck(state);
    }
  }
  function clearField(state) {
    state.field = null;
    state.elevenBack = false;
    state.passed.fill(false);
  }
  function finishTurn(state, idx, continueSelf) {
    if (state.over) return;
    const p = state.players[idx];
    state.turn = (continueSelf && !p.finished) ? idx : nextIndex(state, idx);
  }
  function toggleRevolution(state, ev, kind) {
    state.revolution = !state.revolution;
    state.revCount++;
    ev.push({ type: kind, on: state.revolution });
  }

  // 後処理の順番：7渡し → 10捨て → 8切り（8切りは一番最後）。
  // 10捨てがあれば先に捨て札を選ばせ、終わってから8切りで場を流す。
  function finishEffects(state, idx, tens, eight, ev) {
    const p = state.players[idx];
    if (tens > 0 && !p.finished && p.hand.length > 0) {
      state.phase = 'discard';
      state.pendingDiscard = { from: idx, remaining: Math.min(tens, p.hand.length), eight };
      return;
    }
    if (eight) { clearField(state); ev.push({ type: 'eight' }); }
    finishTurn(state, idx, eight && !p.finished);
  }
  // 捨て札：選んだ札を手札から外し、場には出さず、ゲームから外す（CPUの計算では見えた札として扱う）
  // 必要枚数：残り枚数と手札枚数の小さい方
  function discardNeed(state, idx) {
    const d = state.pendingDiscard;
    return d ? Math.min(d.remaining, state.players[idx].hand.length) : 0;
  }
  function discardCards(state, idx, cardIds) {
    const d = state.pendingDiscard;
    if (!d || state.phase !== 'discard' || d.from !== idx) return fail('捨て札の処理中ではありません');
    const p = state.players[idx];
    const need = discardNeed(state, idx);
    if (cardIds.length !== need) return fail(`${need}枚選んでください`);
    if (new Set(cardIds).size !== cardIds.length) return fail('同じ札は選べません');
    const cards = p.hand.filter(c => cardIds.includes(c.id));
    if (cards.length !== cardIds.length) return fail('手札から選んでください');
    p.hand = removeCards(p.hand, cards);
    state.played.push(...cards);
    state.pendingDiscard = null;
    state.phase = 'play';
    const ev = [{ type: 'discard', idx, n: cards.length }];
    if (p.hand.length === 0) finishPlayer(state, idx, ev);
    if (!state.over) finishEffects(state, idx, 0, d.eight, ev);
    return { ok: true, events: ev };
  }
  function applyPlay(state, idx, cards, mode = 'normal') {
    const ctx = ctxOf(state);
    const info = evaluatePlay(cards, ctx, mode);
    if (!info.ok) return info;
    if (bansStrongFinish(cards, state.players[idx].hand, ctx)) return fail('最強のカードでは上がれません');
    const p = state.players[idx];
    const nums = info.effNums;
    p.hand = removeCards(p.hand, cards);
    state.played.push(...cards);
    state.playId++;
    state.passed.fill(false);
    state.field = { cards: cards.slice(), owner: idx, kind: info.kind, len: info.len, rev: info.rev, power: info.power, unbeatable: !!info.unbeatable };
    const ev = [{ type: 'play', idx, cards: cards.slice(), kind: info.kind, len: info.len, rev: info.rev }];
    if (info.unbeatable) ev.push({ type: 'spade3' });

    if (info.rev) toggleRevolution(state, ev, 'stairRev');
    else if (info.kind === 'set' && info.len >= 4 && state.rules.revolution && (info.len === 4 || state.rules.revMin4)) toggleRevolution(state, ev, 'revolution');

    if (nums.includes(11) && state.rules.elevenBack && !state.elevenBack) {
      state.elevenBack = true;
      ev.push({ type: 'eleven' });
    }

    // 階段革命は場を流さない。8切りは、7渡し・10捨ての後に最後に行う。10捨ては場を流さない。
    const eight = !info.rev && !!state.rules.eightCut && nums.includes(8);
    const tens = (!info.rev && state.rules.tenDump) ? nums.filter(n => n === 10).length : 0;
    if (tens) ev.push({ type: 'ten', n: tens });

    if (p.hand.length === 0) finishPlayer(state, idx, ev);
    if (state.over) return { ok: true, events: ev };

    const sevens = nums.filter(n => n === 7).length;
    if (state.rules.sevenPass && sevens > 0 && p.hand.length > 0 && sevenTargets(state, idx).length > 0) {
      state.phase = 'seven';
      state.pendingSeven = { from: idx, remaining: Math.min(sevens, p.hand.length), tens, eight };
      ev.push({ type: 'sevenStart', idx });
      return { ok: true, events: ev };
    }
    finishEffects(state, idx, tens, eight, ev);
    return { ok: true, events: ev };
  }
  function applyPass(state, idx) {
    if (!state.field) return fail('場が出ていないのでパスできません');
    state.passed[idx] = true;
    const ev = [{ type: 'pass', idx }];
    const owner = state.field.owner;
    const remaining = state.players.filter(p => !p.finished && p.id !== owner && !state.passed[p.id]);
    if (remaining.length === 0) {
      clearField(state);
      ev.push({ type: 'flush' });
      state.turn = state.players[owner].finished ? nextIndex(state, owner) : owner;
    } else {
      state.turn = nextIndex(state, idx);
    }
    return { ok: true, events: ev };
  }
  // 必要枚数：残り枚数と手札枚数の小さい方（手札が足りないときはある分だけ渡す）
  function sevenNeed(state) {
    const s = state.pendingSeven;
    return s ? Math.min(s.remaining, state.players[s.from].hand.length) : 0;
  }
  // 7渡し：選んだ枚数ぶんの札をまとめて、次の手番の上がっていないプレイヤーに渡す（渡す相手は1人に決まる）
  function giveSevenCards(state, cardIds) {
    const s = state.pendingSeven;
    if (!s || state.phase !== 'seven') return fail('7渡しの処理中ではありません');
    const from = state.players[s.from];
    const need = sevenNeed(state);
    if (cardIds.length !== need) return fail(`${need}枚選んでください`);
    if (new Set(cardIds).size !== cardIds.length) return fail('同じ札は選べません');
    const cards = from.hand.filter(c => cardIds.includes(c.id));
    if (cards.length !== cardIds.length) return fail('手札から選んでください');
    const targets = sevenTargets(state, s.from);
    if (!targets.length) return fail('渡せる相手がいません');
    const target = targets[0];
    from.hand = removeCards(from.hand, cards);
    target.hand = target.hand.concat(cards);
    const ev = [{ type: 'give', from: s.from, to: target.id, n: cards.length }];
    completeSeven(state, ev);
    return { ok: true, events: ev };
  }
  function completeSeven(state, ev) {
    const s = state.pendingSeven;
    state.pendingSeven = null;
    state.phase = 'play';
    const from = state.players[s.from];
    if (!from.finished && from.hand.length === 0) finishPlayer(state, s.from, ev);
    if (!state.over) finishEffects(state, s.from, s.tens, s.eight, ev);
  }

  // 役の割り当て。順位どおりに役を決める。都落ちONで、前回の大富豪が今回1位でなければ大貧民に落とす。
  function assignRoles(state) {
    const n = state.players.length;
    const order = [...state.players].sort((a, b) => a.rank - b.rank);
    state.fallenId = null;
    if (state.rules.outcast) {
      const fallen = state.players.find(p => p.role === '大富豪');
      if (fallen && fallen.rank !== 1) {
        state.fallenId = fallen.id;
        order.splice(order.indexOf(fallen), 1);
        order.push(fallen);
      }
    }
    order.forEach((p, i) => { p.role = roleForRank(i + 1, n); });
    return state.players.map(p => p.role);
  }

  return {
    SUITS, SUIT_SYM, ROLE_NAMES, label, isJoker, kindText, createDeck, shuffle,
    cardPower, isStairShape, playInfo, evaluatePlay, legalPlays, ctxOf, nextSeat, stuckCheck,
    startGame, pendingExchange, pickStrongest, exchangeGive, exchangeReturn,
    sevenTargets, sevenNeed, discardNeed, giveSevenCards, applyPlay, applyPass, assignRoles, leaderIndex, discardCards,
    roleForRank, removeCards,
  };
})();

/* =====================================================================
 * 2. CPU思考。自分の手札と公開情報だけを受け取る。他人の手札は参照しない。
 * ===================================================================== */
const CPU = (() => {
  const L = Logic;

  function view(state, idx) {
    return {
      hand: state.players[idx].hand.slice(),
      rules: state.rules,
      revolution: state.revolution,
      elevenBack: state.elevenBack,
      field: state.field ? state.field.cards.slice() : null,
      fieldInfo: state.field ? { kind: state.field.kind, len: state.field.len, rev: state.field.rev, power: state.field.power, unbeatable: state.field.unbeatable } : null,
      others: state.players.filter(p => p.id !== idx).map(p => ({
        id: p.id, count: p.hand.length, finished: p.finished, passed: state.passed[p.id],
      })),
      played: state.played.slice(),
      nextSeat: L.nextSeat(state, idx),
    };
  }
  function unseen(v) {
    const seen = new Set([...v.played.map(c => c.id), ...v.hand.map(c => c.id)]);
    return L.createDeck().filter(c => !seen.has(c.id));
  }
  const ctxOf = v => ({ rules: v.rules, revolution: v.revolution, elevenBack: v.elevenBack, field: v.field, fieldInfo: v.fieldInfo });
  const flushes = (cards, rules, rev) => !rev && !!rules.eightCut && cards.some(c => c.num === 8);
  const rnd = a => a[Math.floor(Math.random() * a.length)];

  function strongPick(v, ctx, items, lead) {
    const pool = unseen(v);
    const bestOf = cards => cards.reduce((a, b) => (L.cardPower(b, ctx) > L.cardPower(a, ctx) ? b : a));
    const isTop = c => { const pw = L.cardPower(c, ctx); return !pool.some(u => L.cardPower(u, ctx) > pw); };
    const urgent = v.others.some(o => !o.finished && o.count <= 2);
    if (lead) {
      items.forEach(x => {
        x.score = x.n * 2 - x.p * 0.3 + (isTop(bestOf(x.cards)) ? 3 : 0) + (x.rev ? 1 : 0) + (x.flush ? 2 : 0);
      });
      items.sort((a, b) => b.score - a.score);
      return items[0];
    }
    const normals = items.filter(x => !x.rev).sort((a, b) => a.p - b.p);
    if (!normals.length) return v.hand.length <= 3 ? items.find(x => x.rev) : null;
    const fieldInfo = v.fieldInfo || { power: 0 };
    const flushOpt = normals.find(x => x.flush && fieldInfo.power >= 13);
    if (flushOpt) return flushOpt;
    if (!urgent && normals[0].p >= 15 && v.hand.length > 3) return null;
    return normals[0];
  }

  // 戻り値: {cards, rev} または null（パス）
  function choosePlay(v, level) {
    const ctx = ctxOf(v);
    const plays = L.legalPlays(v.hand, ctx);
    if (!plays.length) return null;
    const lead = !v.field;
    const items = plays.map(x => ({
      cards: x.cards, rev: x.rev, n: x.cards.length,
      p: L.playInfo(x.cards, ctx, x.rev ? 'rev' : 'normal').power,
      flush: flushes(x.cards, v.rules, x.rev),
    }));
    let pick = null;
    if (level === '弱い') {
      pick = (!lead && Math.random() < 0.2) ? null : rnd(items);
    } else if (level === '普通') {
      const normals = items.filter(x => !x.rev);
      if (lead) {
        const pool = normals.length ? normals : items;
        pool.sort((a, b) => (a.p - a.n * 2) - (b.p - b.n * 2));
        pick = pool[0];
      } else {
        normals.sort((a, b) => a.p - b.p);
        if (normals.length && !(normals[0].p >= 15 && v.hand.length > 3)) pick = normals[0];
      }
    } else {
      pick = strongPick(v, ctx, items, lead);
    }
    if (!pick && lead) pick = items[0];
    return pick ? { cards: pick.cards, rev: pick.rev } : null;
  }

  // 7渡し：弱い札から、枚数ぶん渡す（ジョーカーは最後）。戻り値: 渡す札のid
  function chooseSevenCards(hand, count, ctx) {
    return hand.slice().sort((a, b) => L.cardPower(a, ctx) - L.cardPower(b, ctx)).slice(0, count).map(c => c.id);
  }

  // 戻り値: 返す札の配列
  function chooseReturn(hand, count, level, ctx) {
    const cands = hand.slice();
    // 弱い札から返す。ジョーカーは最強なので、返す札は最後に回す
    if (level === '弱い') { const nj = L.shuffle(cands.filter(c => !L.isJoker(c))); return nj.concat(cands.filter(c => L.isJoker(c))).slice(0, count); }
    const sib = c => hand.filter(x => x.num === c.num).length;
    const cost = c => L.cardPower(c, ctx) + (level === '強い' ? (sib(c) - 1) * 3 : 0);
    return cands.slice().sort((a, b) => cost(a) - cost(b)).slice(0, count);
  }
  // 10捨て：弱い札から順に捨てる（ジョーカーは最後）。戻り値: 捨てる札のid
  function chooseDiscard(hand, count, ctx) {
    return hand.slice().sort((a, b) => L.cardPower(a, ctx) - L.cardPower(b, ctx)).slice(0, count).map(c => c.id);
  }
  return { view, choosePlay, chooseSevenCards, chooseReturn, chooseDiscard };
})();

const PIP_POS = {

function pipsHTML(num, s) {

  const value = num === 15 ? 2 : num;                            // 内部値の2は15
  return PIP_POS[value].map(([x, y]) =>

function cardHTML(c, o = {}) {

    cls.push('joker');
    body = '<div class="jt"><b>JOKER</b></div>';

    const red = c.suit === 'H' || c.suit === 'D';
    cls.push(red ? 'red' : 'black');
    const L = Logic.label(c.num), s = Logic.SUIT_SYM[c.suit] + '\uFE0E';
    const corners = `<span class="ix tl">${L}<small>${s}</small></span><span class="ix br">${L}<small>${s}</small></span>`;
    const mid = (c.num >= 11 && c.num <= 13)

    body = corners + mid;

  return `<div class="${cls.join(' ')}" data-cid="${c.id}">${body}</div>`;
}

function sortCards(g, arr) {
  const ctx = Logic.ctxOf(g);
  const SO = { S: 0, H: 1, D: 2, C: 3, X: 4 };

  if (UI.sortMode === 'num') a.sort((x, y) => Logic.cardPower(x, ctx) - Logic.cardPower(y, ctx) || SO[x.suit] - SO[y.suit]);

/* ---------- ゲームの進行 ---------- */
function addMsg(t) { UI.messages.push(t); if (UI.messages.length > 6) UI.messages.shift(); }
let telopTimer = null;
function telop(text) {
  const el = $('#telop');
  el.textContent = text;
  el.classList.remove('hidden');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(telopTimer);
  telopTimer = setTimeout(() => el.classList.add('hidden'), 1000);
}
let toastTimer = null;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
}
function announce(g, e) {
  const nm = i => g.players[i].name;
  switch (e.type) {
    case 'play': addMsg(`${nm(e.idx)}：${e.cards.map(cardName).join(' ')}（${Logic.kindText(e.kind, e.len, e.rev)}）`); break;
    case 'pass': addMsg(`${nm(e.idx)}：パス`); break;
    case 'flush': addMsg('場が流れました'); telop('場が流れました'); break;
    case 'eight': addMsg('8切り！'); telop('8切り！'); break;
    case 'ten': addMsg(`10捨て！（${e.n}枚捨てます）`); telop('10捨て！'); break;
    case 'discard': addMsg(`${nm(e.idx)}が${e.n}枚捨てました`); break;
    case 'eleven': addMsg('11バック！'); telop('11バック！'); break;
    case 'revolution': addMsg(e.on ? '革命！' : '革命返し！'); telop(e.on ? '革命！' : '革命返し！'); break;
    case 'stairRev': addMsg(`階段革命！（${e.on ? '革命' : '革命返し'}）`); telop('階段革命！'); break;
    case 'sevenStart': addMsg(`${nm(e.idx)}が7を出しました（7渡し）`); telop('7渡し！'); break;
    case 'give': addMsg(`${nm(e.from)}が${nm(e.to)}に札を渡しました`); break;
    case 'spade3': addMsg('スペードの3でジョーカーに勝ちました（この場は流れるまで誰も勝てません）'); telop('スペードの3！'); break;
    case 'finish': addMsg(`${nm(e.idx)}が${e.rank}位で上がり！`); telop(`${nm(e.idx)} ${e.rank}位上がり`); break;
  }
}
function afterAction(g, events) {
  events.forEach(e => announce(g, e));
  runFlow();
}
function runFlow() {
  const g = UI.game;
  if (!g) return;
  const who = g.players[g.turn];
  if (g.phase === 'play' && who && !who.finished && Logic.stuckCheck(g)) {
    addMsg(`${who.name}は上がれるカードがなく、最後まで残ります`);
    runFlow();
    return;
  }
  if (g.over) {
    recordGame(g);
    netBroadcast();
    renderAll();
    openResult();
    return;
  }
  netBroadcast();
  renderAll();
  if (g.phase === 'exchange') { handleExchange(); return; }
  if (g.phase === 'discard') {
    const from = g.players[g.pendingDiscard.from];
    if (from.id === UI.myId) { if (UI.overlay !== 'discard') openDiscard(); }
    else if (!from.isHuman) {
      clearTimeout(UI.timer);
      UI.timer = setTimeout(() => cpuDiscard(g), 500);
    }
    return;
  }
  if (g.phase === 'seven') {
    const from = g.players[g.pendingSeven.from];
    if (from.id === UI.myId) { if (UI.overlay !== 'seven') openSeven(); }
    else if (!from.isHuman) {
      clearTimeout(UI.timer);
      UI.timer = setTimeout(() => cpuSeven(g), 500);
    }
    return;
  }
  const cur = g.players[g.turn];
  if (!cur.isHuman) {
    clearTimeout(UI.timer);
    const delay = cur.level === '弱い' ? 900 : cur.level === '普通' ? 750 : 600;
    UI.timer = setTimeout(() => cpuTurn(g), delay);
  }
}
function cpuTurn(g) {
  if (UI.game !== g || g.over || g.phase !== 'play') return;
  const idx = g.turn, p = g.players[idx];
  if (p.isHuman) return;
  const choice = CPU.choosePlay(CPU.view(g, idx), p.level);
  let res = choice ? Logic.applyPlay(g, idx, choice.cards, choice.rev ? 'rev' : 'normal') : Logic.applyPass(g, idx);
  if (!res.ok && g.field) res = Logic.applyPass(g, idx);
  if (!res.ok) return;
  afterAction(g, res.events);
}
function cpuSeven(g) {
  if (UI.game !== g || g.phase !== 'seven') return;
  const s = g.pendingSeven, p = g.players[s.from];
  const res = Logic.giveSevenCards(g, CPU.chooseSevenCards(p.hand, Logic.sevenNeed(g), Logic.ctxOf(g)));
  if (!res.ok) return;
  afterAction(g, res.events);
}
/* ---------- 10捨て（捨て札の選択） ---------- */
function cpuDiscard(g) {
  if (UI.game !== g || g.phase !== 'discard') return;
  const d = g.pendingDiscard, p = g.players[d.from];
  const res = Logic.discardCards(g, d.from, CPU.chooseDiscard(p.hand, Logic.discardNeed(g, d.from), Logic.ctxOf(g)));
  if (!res.ok) return;
  afterAction(g, res.events);
}

/* ---------- 大富豪交換 ---------- */
function handleExchange() {
  const g = UI.game;
  const ex = Logic.pendingExchange(g);
  if (!ex) return;
  const giver = g.players[ex.giver], recv = g.players[ex.receiver];
  if (ex.stage === 'give') {
    // 「交換の札を自分で選ぶ」ONで受け取る側が人間なら、その人が渡す側の手札から選ぶ
    if (recv.isHuman && g.rules.exchangeChoose) {
      if (recv.id === UI.myId && UI.overlay !== 'exchange') openExchange(ex, 'take');
      return;
    }
    clearTimeout(UI.timer);
    UI.timer = setTimeout(() => {
      if (UI.game !== g) return;
      const e2 = Logic.pendingExchange(g);
      if (!e2 || e2.stage !== 'give') return;
      const gv = g.players[e2.giver], rv = g.players[e2.receiver];
      Logic.exchangeGive(g, e2, Logic.pickStrongest(gv.hand, e2.count, Logic.ctxOf(g)));
      addMsg(`${gv.name}が${rv.name}に札を渡しました（交換）`);
      runFlow();
    }, giver.isHuman ? 0 : 600);
    return;
  }
  if (recv.isHuman) {
    if (recv.id === UI.myId && UI.overlay !== 'exchange') openExchange(ex, 'return');
    return;
  }
  clearTimeout(UI.timer);
  UI.timer = setTimeout(() => {
    if (UI.game !== g) return;
    const e2 = Logic.pendingExchange(g);
    if (!e2 || e2.stage !== 'return') return;
    const rv = g.players[e2.receiver], gv = g.players[e2.giver];
    const cards = CPU.chooseReturn(rv.hand, e2.count, rv.level, Logic.ctxOf(g));
    Logic.exchangeReturn(g, e2, cards);
    addMsg(`${rv.name}が${gv.name}に${cards.length}枚を返しました`);
    runFlow();
  }, 700);
}
const exWho = (g, ex) => g.players[UI.exMode === 'return' ? ex.receiver : ex.giver];
function openExchange(ex, mode) {
  UI.selected.clear();
  UI.exchange = ex;
  UI.exMode = mode;
  UI.exSel = new Set();
  UI.exStep = 'select';
  renderExchange();
}
function renderExchange() {
  const g = UI.game, ex = UI.exchange, mode = UI.exMode;
  const who = exWho(g, ex);
  const other = g.players[mode === 'return' ? ex.giver : ex.receiver];
  let body;
  if (UI.exStep === 'confirm') {
    const chosen = who.hand.filter(c => UI.exSel.has(c.id));
    const msg = mode === 'take'
      ? `${esc(who.name)}の手札から選んだ${ex.count}枚を受け取る札として決定します。よろしいですか？`
      : `${esc(other.name)}に返す札${ex.count}枚を決定します。よろしいですか？`;
    body = `<p>${msg}</p>

  } else {
    const text = mode === 'take'
      ? `${esc(who.name)}の手札（見えています）から、受け取る札を${ex.count}枚選んでください（ジョーカーも選べます）`
      : `${esc(other.name)}に返す札を${ex.count}枚選んでください（受け取った札を含む。ジョーカーも選べます）`;
    body = `<p>${text}</p>

  openOverlay('exchange', `<div class="modal"><h2>大富豪交換</h2>${body}</div>`);

function startSeries() {
  readSettingsDOM();

  if (isHost()) namedPeers().filter(p => p.dc.readyState === 'open').forEach(p => humans.push({ name: p.name, peer: p }));
  const total = humans.length + d.cpuCount;
  if (total < 3 || total > 8) { toast(`合計${total}人です。3〜8人になるように、CPUの数を変えてください`); return; }
  const players = humans.map((h, s) => ({
    name: h.name, isHuman: true, level: '普通', record: emptyRecord(), role: null,
    seatName: s === 0 ? null : CPU_NAMES[s - 1],

  for (let k = 0; k < d.cpuCount; k++) {

/* =====================================================================
 * 4. マルチプレイ（同じネットワーク内のWebRTC）
 *    サーバーは使わない。接続コードをコピー＆ペーストして1対1の接続を作る。
 *    ホストが対局を管理し、ゲストは表示と操作の送信だけを行う。
 * ===================================================================== */
const NET_PREFIX = 'DFG1.';
const isHost = () => !!UI.net && UI.net.role === 'host';
const isGuest = () => !!UI.net && UI.net.role === 'guest';
const hostPeers = () => (UI.net ? UI.net.peers : []);
const namedPeers = () => hostPeers().filter(p => p.name && !p.dropped);
const newPC = () => new RTCPeerConnection({ iceServers: [] });
const lobbyHumanCount = () => 1 + namedPeers().length;

function encodeCode(desc) {
  const json = JSON.stringify({ type: desc.type, sdp: desc.sdp });
  return NET_PREFIX + btoa(String.fromCharCode(...new TextEncoder().encode(json)));
}
function decodeCode(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(NET_PREFIX)) throw new Error('コードの形式が違います');
  const bytes = Uint8Array.from(atob(s.slice(NET_PREFIX.length)), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function waitIce(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    const onChange = () => {
      if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', onChange); resolve(); }
    };
    pc.addEventListener('icegatheringstatechange', onChange);
    setTimeout(resolve, 5000);
  });
}
function netSend(dc, m) { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(m)); }
function netSeat(seat, m) { const p = hostPeers().find(x => x.seat === seat); if (p) netSend(p.dc, m); }
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('コピーしました'), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? 'コピーしました' : 'コピーできません。文字を選んでコピーしてください');
}
function refreshLobby() { if (UI.screen === 'hostlobby') { readSettingsDOM(); render(); } }

/* ---------- ホスト側 ---------- */
async function hostMakeOffer() {
  const pc = newPC();
  const dc = pc.createDataChannel('daifugou');
  const peer = { pc, dc, name: '', seat: null, dropped: false, code: '' };
  UI.net.peers.push(peer);
  dc.onmessage = e => netHostMessage(peer, JSON.parse(e.data));
  dc.onclose = () => netDrop(peer);
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) netDrop(peer); };
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  peer.code = encodeCode(pc.localDescription);
  return peer;
}
async function openInvite() {
  if (!isHost()) return;
  toast('コードを作成しています…');
  const peer = await hostMakeOffer();
  UI.invitePeer = peer;
  openOverlay('invite', `<div class="modal"><h2>参加者を追加</h2>
    <p>① 参加者に、下のコードを送ってください（コピーして貼り付け）。</p>
    <textarea id="offerTa" class="txt code" readonly>${peer.code}</textarea>
    <div class="row"><button class="btn" data-act="copyOffer">コードをコピー</button></div>
    <p>② 参加者が作った「返答コード」を、下に貼り付けてください。</p>
    <textarea id="answerIn" class="txt code" placeholder="返答コードを貼り付け"></textarea>
    <div class="row"><button class="btn ghost" data-act="closeInvite">閉じる</button>
    <button class="btn big" data-act="connectAnswer">接続する</button></div></div>`);
}
async function connectAnswer() {
  const peer = UI.invitePeer;
  if (!peer) return;
  let desc;
  try { desc = decodeCode($('#answerIn').value); } catch (e) { toast(e.message); return; }
  try { await peer.pc.setRemoteDescription(desc); } catch (e) { toast('返答コードが正しくありません'); return; }
  UI.invitePeer = null;
  closeOverlay();
  toast('接続しています…');
}
function closeInvite() {
  const peer = UI.invitePeer;
  UI.invitePeer = null;
  if (peer && !peer.name && peer.pc.connectionState !== 'connected') netDrop(peer);
  closeOverlay();
}
function netHostMessage(peer, m) {
  peer.seen = Date.now();
  if (m.t === 'bye') return netDrop(peer);
  if (m.t === 'ping') return;
  if (m.t === 'hello') return netHello(peer, m.name);
  if (m.t === 'act' && peer.seat !== null) applyAct(peer.seat, m.a);
}
function netHello(peer, name) {
  peer.name = String(name || 'ゲスト').slice(0, 10);
  if (!UI.game) {
    if (namedPeers().length > 7) { netSend(peer.dc, { t: 'full' }); netDrop(peer); return; }
    netSend(peer.dc, { t: 'welcome', seat: -1 });
    refreshLobby();
    return;
  }
  const seat = pickSeat(peer.name);
  if (seat === null) { netSend(peer.dc, { t: 'full' }); netDrop(peer); return; }
  seatTake(seat, peer.name);
  peer.seat = seat;
  netSend(peer.dc, { t: 'welcome', seat });
  addMsg(`${peer.name}さんが${UI.series.players[seat].seatName}の席に参加しました`);
  toast(`${peer.name}さんが参加しました`);
  runFlow();
}
// 途中参加：同じ名前のCPUの席があればそこ、なければ空いているCPUの席からランダム
function pickSeat(name) {
  const g = UI.game, sp = UI.series.players;
  const free = sp.map((p, s) => s).filter(s => s > 0 && !sp[s].isHuman && !g.players[s].finished);
  if (!free.length) return null;
  const same = free.find(s => sp[s].seatName === name);
  return same !== undefined ? same : free[Math.floor(Math.random() * free.length)];
}
function seatTake(seat, name) {
  const sp = UI.series.players[seat];
  sp.isHuman = true; sp.name = name;
  const gp = UI.game && UI.game.players[seat];
  if (gp) { gp.isHuman = true; gp.name = name; }
}
function seatRevert(seat) {
  const sp = UI.series.players[seat];
  sp.isHuman = false; sp.name = sp.seatName; if (!sp.level) sp.level = '普通';
  const gp = UI.game && UI.game.players[seat];
  if (gp) { gp.isHuman = false; gp.name = sp.name; gp.level = sp.level; }
}
function netDrop(peer) {
  if (!UI.net || peer.dropped) return;
  peer.dropped = true;
  try { peer.dc.close(); } catch (e) {}
  try { peer.pc.close(); } catch (e) {}
  UI.net.peers = UI.net.peers.filter(p => p !== peer);
  if (peer.seat !== null && UI.series && UI.game) {
    seatRevert(peer.seat);
    addMsg(`${peer.name}さんが切断しました。CPUが代わります`);
    toast(`${peer.name}さんの接続が切れました。CPUが代わります`);
    runFlow();
  } else refreshLobby();
}
// ホスト：生存の合図（ping）が8秒以上届かない参加者は切断とみなす（ブラウザを閉じても検出できるように）
function startHostWatch() {
  clearInterval(UI.net.timer);
  UI.net.timer = setInterval(() => {
    if (!isHost()) return;
    hostPeers().slice().forEach(p => { if (p.seen && Date.now() - p.seen > 8000) netDrop(p); });
  }, 2000);
}
function netSeriesEnded() {
  if (!isHost()) return;
  hostPeers().forEach(p => { if (p.seat !== null) { p.seat = null; netSend(p.dc, { t: 'lobby' }); } });
}
// ゲストに渡す状態。他人の手札は枚数だけにする（交換で受け取る側には渡す側の手札を見せる）
function maskFor(g, seat) {
  const ex = g.phase === 'exchange' ? Logic.pendingExchange(g) : null;
  const players = g.players.map(p => {
    const reveal = p.id === seat || (!!ex && ex.stage === 'give' && p.id === ex.giver && seat === ex.receiver);
    const hand = reveal ? p.hand : p.hand.map((c, k) => ({ id: -1000 - p.id * 100 - k, suit: 'X', num: 0 }));
    return { ...p, hand };
  });
  return JSON.parse(JSON.stringify({ ...g, players }));
}
function netBroadcast() {
  if (!isHost() || !UI.game || !UI.series) return;
  const series = {
    players: UI.series.players.map(p => ({ name: p.name, isHuman: p.isHuman, level: p.level, record: p.record, role: p.role })),
    rules: UI.series.rules, gameCount: UI.series.gameCount,
  };
  hostPeers().forEach(p => {
    if (p.seat !== null) netSend(p.dc, { t: 'state', seat: p.seat, game: maskFor(UI.game, p.seat), series, msgs: UI.messages });
  });
}

/* ---------- ゲスト側 ---------- */
async function guestAnswer(offerCode, name) {
  const pc = newPC();
  UI.net = { role: 'guest', pc, dc: null, name };
  pc.ondatachannel = e => {
    UI.net.dc = e.channel;
    e.channel.onopen = () => {
      netSend(e.channel, { t: 'hello', name });
      UI.net.ping = setInterval(() => netSend(e.channel, { t: 'ping' }), 2000);
      window.addEventListener('pagehide', () => netSend(e.channel, { t: 'bye' }));
    };
    e.channel.onmessage = ev => guestMessage(JSON.parse(ev.data));
    e.channel.onclose = () => guestDrop();
  };
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) guestDrop(); };
  await pc.setRemoteDescription(decodeCode(offerCode));
  await pc.setLocalDescription(await pc.createAnswer());
  await waitIce(pc);
  return encodeCode(pc.localDescription);
}
function guestMessage(m) {
  if (m.t === 'welcome') {
    UI.myId = m.seat;
    if (m.seat < 0) { UI.game = null; UI.screen = 'guestlobby'; render(); }
  } else if (m.t === 'state') guestApply(m);
  else if (m.t === 'lobby') { UI.game = null; closeOverlay(); UI.screen = 'guestlobby'; render(); }
  else if (m.t === 'end') { toast('ホストが部屋を閉じました'); guestLeave(); }
  else if (m.t === 'full') { toast('部屋が満員です'); guestLeave(); }
  else if (m.t === 'err') { toast(m.msg); if (UI.game) guestOverlays(UI.game); }
}
function guestApply(m) {
  const first = UI.screen !== 'game';
  const prev = UI.game;
  UI.myId = m.seat;
  UI.series = m.series;
  UI.messages = m.msgs || [];
  const changed = !prev || prev.turn !== m.game.turn || prev.playId !== m.game.playId || prev.phase !== m.game.phase;
  UI.game = m.game;
  if (changed) UI.selected.clear();
  if (!UI.inGame) { history.pushState({ game: true }, ''); UI.inGame = true; }
  UI.screen = 'game';
  if (first) render(); else renderAll();
  if (m.game.over) { if (UI.overlay !== 'result') openResult(); return; }
  if (UI.overlay === 'result') closeOverlay();
  guestOverlays(m.game);
}
// 自分の番の操作画面（7渡し・交換）を、状態に合わせて開く・閉じる
function guestOverlays(g) {
  const me = UI.myId;
  if (g.phase === 'seven' && g.pendingSeven.from === me) {
    const key = `${g.playId}-${g.pendingSeven.remaining}`;
    if (UI.overlay !== 'seven' || UI.sevKey !== key) { UI.sevKey = key; openSeven(); }
  } else if (UI.overlay === 'seven') closeOverlay();
  if (g.phase === 'discard' && g.pendingDiscard.from === me) {
    const key = `${g.playId}-${g.pendingDiscard.remaining}`;
    if (UI.overlay !== 'discard' || UI.disKey !== key) { UI.disKey = key; openDiscard(); }
  } else if (UI.overlay === 'discard') closeOverlay();
  const ex = g.phase === 'exchange' ? Logic.pendingExchange(g) : null;
  let mode = null;
  if (ex && ex.receiver === me) mode = ex.stage === 'give' ? (g.rules.exchangeChoose ? 'take' : null) : 'return';
  if (mode) {
    const key = `${mode}-${ex.stage}-${ex.count}-${ex.giver}-${ex.receiver}`;
    if (UI.overlay !== 'exchange' || UI.exKey !== key) { UI.exKey = key; openExchange(ex, mode); }
  } else if (UI.overlay === 'exchange') closeOverlay();
}
function guestDrop() {
  if (!UI.net || UI.net.role !== 'guest') return;
  toast('ホストとの接続が切れました');
  guestLeave();
}
function guestLeave() {
  netLeave();
  UI.game = null; UI.series = null; UI.myId = 0;
  UI.screen = 'title'; closeOverlay(); render();
}

/* ---------- 共通 ---------- */
// 操作の提出：ゲストは送信、ホストは自分の座席として直接処理する
function submit(a) {
  if (isGuest()) { netSend(UI.net.dc, { t: 'act', a }); UI.selected.clear(); return; }
  applyAct(UI.myId, a);
}
// 座席 seat の操作を処理する（ホストだけが行う）。遠隔の座席の不正な操作はその人にだけ伝える。
function applyAct(seat, a) {
  const g = UI.game;
  if (!g || g.over) return;
  const local = seat === UI.myId;
  const fail = reason => { if (local) { toast(reason); runFlow(); } else netSeat(seat, { t: 'err', msg: reason }); };
  if (a.k === 'play') {
    if (g.phase !== 'play' || g.turn !== seat) return fail('あなたの番ではありません');
    const cards = g.players[seat].hand.filter(c => a.ids.includes(c.id));
    const res = Logic.applyPlay(g, seat, cards, a.mode || 'normal');
    if (!res.ok) return fail(res.reason);
    if (local) UI.selected.clear();
    afterAction(g, res.events);
  } else if (a.k === 'pass') {
    if (g.phase !== 'play' || g.turn !== seat) return fail('あなたの番ではありません');
    const res = Logic.applyPass(g, seat);
    if (!res.ok) return fail(res.reason);
    if (local) UI.selected.clear();
    afterAction(g, res.events);
  } else if (a.k === 'seven') {
    if (g.phase !== 'seven' || g.pendingSeven.from !== seat) return fail('7渡しの番ではありません');
    const res = Logic.giveSevenCards(g, a.ids);
    if (!res.ok) return fail(res.reason);
    if (local) closeOverlay();
    afterAction(g, res.events);
  } else if (a.k === 'discard') {
    if (g.phase !== 'discard' || g.pendingDiscard.from !== seat) return fail('捨て札の番ではありません');
    const res = Logic.discardCards(g, seat, a.ids);
    if (!res.ok) return fail(res.reason);
    if (local) closeOverlay();
    afterAction(g, res.events);
  } else if (a.k === 'ex') {
    const ex = Logic.pendingExchange(g);
    if (!ex || ex.receiver !== seat) return fail('交換の番ではありません');
    const wasGive = ex.stage === 'give';
    const src = wasGive ? g.players[ex.giver] : g.players[ex.receiver];
    const cards = src.hand.filter(c => a.ids.includes(c.id));
    const res = wasGive ? Logic.exchangeGive(g, ex, cards) : Logic.exchangeReturn(g, ex, cards);
    if (!res.ok) return fail(res.reason);
    addMsg(wasGive
      ? `${g.players[ex.receiver].name}が${g.players[ex.giver].name}から札を受け取りました`
      : `${g.players[ex.receiver].name}が${g.players[ex.giver].name}に札を返しました`);
    if (local) closeOverlay();
    runFlow();
  }
}
function netLeave() {
  const n = UI.net;
  if (!n) return;
  clearInterval(n.ping); clearInterval(n.timer);
  UI.net = null;
  if (n.role === 'host') {
    n.peers.forEach(p => { netSend(p.dc, { t: 'end' }); try { p.dc.close(); } catch (e) {} try { p.pc.close(); } catch (e) {} });
  } else {
    try { if (n.dc) n.dc.close(); } catch (e) {}
    try { n.pc.close(); } catch (e) {}
  }
}


function hostPanelHTML() {
  const rows = namedPeers().map(p => `<div class="cpu-row"><span>${esc(p.name)}</span><span class="small">参加中</span></div>`).join('');
  return `<div class="form" style="padding-bottom:0">
    <div class="lbl">参加者（あなたを含む）</div>
    <div class="cpu-row"><span>${esc(UI.draft.name || 'あなた')}（ホスト）</span><span class="small">人間</span></div>
    ${rows}
    <button class="btn" data-act="invite">参加者を追加（コードを発行）</button>
    <p class="small">空いた人数はCPUになります。合計は3〜8人です。途中参加は、CPUと同じ名前で入ると、その席に入れます。同じ名前のCPUがいなければ、空いているCPUの席のどれかに入ります。</p>
  </div>`;
}
function mpHTML() {
  return `<div class="bar"><button class="btn small ghost" data-act="toTitle">← 戻る</button><h1>みんなで遊ぶ</h1><span></span></div>
  <div class="form">
    <p class="small">同じWi-Fi（同じネットワーク）の端末同士で遊べます。サーバーは使わず、接続コードをコピーして相手に送ります。</p>
    <button class="btn big" data-act="hostRoom">部屋を作る（ホスト）</button>
    <button class="btn big" data-act="guestRoom">部屋に参加する（ゲスト）</button>
  </div>`;
}
function guestJoinHTML() {
  const g = UI.guest;
  const body = g.answer
    ? `<p>③ この「返答コード」を、ホストの画面に貼り付けてもらってください（コピーして送る）。</p>
       <textarea id="answerOut" class="txt code" readonly>${g.answer}</textarea>
       <div class="row"><button class="btn" data-act="copyAnswer">返答コードをコピー</button></div>
       <p class="small">ホストが接続すると、ホストの開始を待つ画面に変わります。</p>`
    : `<label class="lbl">あなたの名前（任意）<input id="nameG" class="txt" maxlength="10" placeholder="あなた"></label>
       <label class="lbl">① ホストから受け取った「参加コード」を貼り付け<textarea id="offerIn" class="txt code" placeholder="参加コードを貼り付け"></textarea></label>
       <button class="btn big" data-act="makeAnswer">② 返答コードを作る</button>
       <p class="small">途中参加の場合は、入りたいCPUと同じ名前にすると、その席に入れます（同じ名前のCPUがいなければ、空いているCPUの席のどれかに入ります）。</p>`;
  return `<div class="bar"><button class="btn small ghost" data-act="toTitle">← 戻る</button><h1>部屋に参加</h1><span></span></div>
    <div class="form">${body}</div>`;
}
function guestLobbyHTML() {
  return `<div class="bar"><button class="btn small ghost" data-act="toTitle">やめる</button><h1>部屋</h1><span></span></div>
    <div class="form"><p>接続しました。ホストがゲームを開始するまでお待ちください。</p></div>`;
}

/* ---------- イベント（委譲） ---------- */
// 確認画面。元の画面（交換・7渡しなど）は「もどる」で元どおり戻す
function askConfirm(message, label, fn) {
  UI.confirmBack = UI.overlay ? { kind: UI.overlay, html: $('#overlay').innerHTML } : null;
  UI.confirmFn = fn;
  openOverlay('confirm', `<div class="modal"><h2>確認</h2><p>${esc(message)}</p>
    <div class="row"><button class="btn" data-act="confirmNo">もどる</button>
    <button class="btn big" data-act="confirmYes">${label}</button></div></div>`);
}
function endSeriesNow() {
  clearTimeout(UI.timer);
  netSeriesEnded();
  UI.series = null; UI.game = null; UI.inGame = false;
  UI.screen = 'settings'; closeOverlay(); render();
}

const ACTIONS = {
  mp: () => { UI.screen = 'mp'; render(); },
  hostRoom: () => { UI.net = { role: 'host', peers: [] }; startHostWatch(); UI.screen = 'hostlobby'; render(); },
  guestRoom: () => { UI.net = null; UI.guest = { answer: null, name: '' }; UI.screen = 'guestjoin'; render(); },
  invite: () => openInvite(),
  closeInvite: () => closeInvite(),
  copyOffer: () => copyText($('#offerTa').value),
  connectAnswer: () => connectAnswer(),
  makeAnswer: async () => {
    const name = ($('#nameG').value.trim() || 'あなた').slice(0, 10);
    const code = $('#offerIn').value;
    try {
      const answer = await guestAnswer(code, name);
      UI.guest = { answer, name };
      render();
    } catch (e) { toast('参加コードが正しくありません'); netLeave(); }
  },
  copyAnswer: () => copyText($('#answerOut').value),
  newGame: () => { UI.screen = 'settings'; render(); },
  toTitle: () => { netLeave(); UI.screen = 'title'; render(); },
  rules: () => openRules(),
  cpu: b => { readSettingsDOM(); UI.draft.cpuCount = +b.dataset.n; render(); },
  start: () => startSeries(),
  play: () => humanPlay(),
  pass: () => humanPass(),
  sort: () => { UI.sortMode = UI.sortMode === 'num' ? 'suit' : 'num'; renderHand(UI.game); renderButtons(UI.game); },
  hl: () => { UI.highlight = !UI.highlight; renderAll(); },
  mode: b => { UI.stairMode = b.dataset.m; renderStatus(UI.game); renderModeBar(UI.game); },
  quit: () => askConfirm('タイトルに戻ります。連続戦は終了します。', 'やめる', endAll),
  board: () => openBoard(),
  closeBoard: () => { if (UI.game && UI.game.over) openResult(); else closeOverlay(); },
  close: () => closeOverlay(),
  next: () => (isGuest() ? toast('次のゲームはホストが開始します') : startNewGame()),
  endSeries: () => (isGuest() ? toast('ホストだけが操作できます') : askConfirm('連続戦を終了します。記録は破棄されます。', '終了する', endSeriesNow)),
  confirmYes: () => { const f = UI.confirmFn; UI.confirmFn = null; UI.confirmBack = null; if (f) f(); },
  confirmNo: () => {
    UI.confirmFn = null;
    const back = UI.confirmBack; UI.confirmBack = null;
    if (back) openOverlay(back.kind, back.html); else closeOverlay();
  },
  // 7渡し
  sevOk: () => {
    const s = UI.game && UI.game.pendingSeven;
    if (!s || UI.seven.sel.size !== Logic.sevenNeed(UI.game)) return;
    const ids = [...UI.seven.sel];
    UI.seven = { sel: new Set() };
    closeOverlay();
    submit({ k: 'seven', ids });
  },
  discOk: () => {
    if (!UI.game || !UI.game.pendingDiscard || UI.discSel.size !== Logic.discardNeed(UI.game, UI.game.pendingDiscard.from)) return;
    const ids = [...UI.discSel];
    closeOverlay();
    UI.discSel = new Set();
    submit({ k: 'discard', ids });
  },
  // 大富豪交換
  exNext: () => {
    if (UI.exSel.size !== UI.exchange.count) return;
    UI.exStep = 'confirm';
    renderExchange();
  },
  exBack: () => { UI.exStep = 'select'; renderExchange(); },
  exFinal: () => {
    const ids = [...UI.exSel];
    closeOverlay();
    UI.exSel = new Set(); UI.exStep = 'select';
    submit({ k: 'ex', ids });
  },
};

document.addEventListener('click', e => {
  const card = e.target.closest('.card[data-cid]');
  if (card) {
    const id = +card.dataset.cid;
    if (UI.overlay === 'exchange' && UI.exStep !== 'confirm' && card.closest('#exHand')) exToggle(id);
    else if (UI.overlay === 'seven' && card.closest('#exHand')) sevToggle(id);
    else if (UI.overlay === 'discard' && card.closest('#exHand')) discToggle(id);
    else if (UI.screen === 'game' && card.closest('#hand')) toggleCard(id);
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const fn = ACTIONS[btn.dataset.act];
  if (fn) fn(btn);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-theme-pick]')) { setTheme(t.value); return; }
  if ((UI.screen === 'settings' || UI.screen === 'hostlobby') && (t.matches('[data-rule]') || t.matches('[data-draft]') || t.id === 'hlIn')) {
    readSettingsDOM();
    render();
  }
});
window.addEventListener('popstate', () => {
  if (UI.screen === 'game' && UI.game) {
    history.pushState({ game: true }, '');
    toast('ゲーム中は戻れません。「やめる」からタイトルへ戻れます');
  }
});

setTheme(UI.theme);
render();
</script>
</body>
</html>
