/* =====================================================================
 * 4. マルチプレイ（同じネットワーク内のWebRTC）
 *    サーバーは使わない。接続コードをコピー＆ペーストして1対1の接続を作る。
 *    ホストが対局を管理し、ゲストは表示と操作の送信だけを行う。
 * ===================================================================== */
const NET_PREFIX = 'DFG1.';
const isHost = () => !!UI.net && UI.net.role === 'host';
const isGuest = () => !!UI.net && UI.net.role === 'guest';
const hostPeers = () => (UI.net ? UI.net.peers : []);
const namedPeers = () => hostPeers().filter(p => p.name && !p.dropped);
const newPC = () => new RTCPeerConnection({ iceServers: [] });
const lobbyHumanCount = () => 1 + namedPeers().length;

function encodeCode(desc) {
  const json = JSON.stringify({ type: desc.type, sdp: desc.sdp });
  return NET_PREFIX + btoa(String.fromCharCode(...new TextEncoder().encode(json)));
}
function decodeCode(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(NET_PREFIX)) throw new Error('コードの形式が違います');
  const bytes = Uint8Array.from(atob(s.slice(NET_PREFIX.length)), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function waitIce(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    const onChange = () => {
      if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', onChange); resolve(); }
    };
    pc.addEventListener('icegatheringstatechange', onChange);
    setTimeout(resolve, 5000);
  });
}
function netSend(dc, m) { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(m)); }
function netSeat(seat, m) { const p = hostPeers().find(x => x.seat === seat); if (p) netSend(p.dc, m); }
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('コピーしました'), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? 'コピーしました' : 'コピーできません。文字を選んでコピーしてください');
}
function refreshLobby() { if (UI.screen === 'hostlobby') { readSettingsDOM(); render(); } }

/* ---------- ホスト側 ---------- */
async function hostMakeOffer() {
  const pc = newPC();
  const dc = pc.createDataChannel('daifugou');
  const peer = { pc, dc, name: '', seat: null, dropped: false, code: '' };
  UI.net.peers.push(peer);
  dc.onmessage = e => netHostMessage(peer, JSON.parse(e.data));
  dc.onclose = () => netDrop(peer);
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) netDrop(peer); };
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  peer.code = encodeCode(pc.localDescription);
  return peer;
}
async function openInvite() {
  if (!isHost()) return;
  toast('コードを作成しています…');
  const peer = await hostMakeOffer();
  UI.invitePeer = peer;
  openOverlay('invite', `<div class="modal"><h2>参加者を追加</h2>
    <p>① 参加者に、下のコードを送ってください（コピーして貼り付け）。</p>
    <textarea id="offerTa" class="txt code" readonly>${peer.code}</textarea>
    <div class="row"><button class="btn" data-act="copyOffer">コードをコピー</button></div>
    <p>② 参加者が作った「返答コード」を、下に貼り付けてください。</p>
    <textarea id="answerIn" class="txt code" placeholder="返答コードを貼り付け"></textarea>
    <div class="row"><button class="btn ghost" data-act="closeInvite">閉じる</button>
    <button class="btn big" data-act="connectAnswer">接続する</button></div></div>`);
}
async function connectAnswer() {
  const peer = UI.invitePeer;
  if (!peer) return;
  let desc;
  try { desc = decodeCode($('#answerIn').value); } catch (e) { toast(e.message); return; }
  try { await peer.pc.setRemoteDescription(desc); } catch (e) { toast('返答コードが正しくありません'); return; }
  UI.invitePeer = null;
  closeOverlay();
  toast('接続しています…');
}
function closeInvite() {
  const peer = UI.invitePeer;
  UI.invitePeer = null;
  if (peer && !peer.name && peer.pc.connectionState !== 'connected') netDrop(peer);
  closeOverlay();
}
function netHostMessage(peer, m) {
  peer.seen = Date.now();
  if (m.t === 'bye') return netDrop(peer);
  if (m.t === 'ping') return;
  if (m.t === 'hello') return netHello(peer, m.name);
  if (m.t === 'act' && peer.seat !== null) applyAct(peer.seat, m.a);
}
function netHello(peer, name) {
  peer.name = String(name || 'ゲスト').slice(0, 10);
  if (!UI.game) {
    if (namedPeers().length > 7) { netSend(peer.dc, { t: 'full' }); netDrop(peer); return; }
    netSend(peer.dc, { t: 'welcome', seat: -1 });
    refreshLobby();
    return;
  }
  const seat = pickSeat(peer.name);
  if (seat === null) { netSend(peer.dc, { t: 'full' }); netDrop(peer); return; }
  seatTake(seat, peer.name);
  peer.seat = seat;
  netSend(peer.dc, { t: 'welcome', seat });
  addMsg(`${peer.name}さんが${UI.series.players[seat].seatName}の席に参加しました`);
  toast(`${peer.name}さんが参加しました`);
  runFlow();
}
// 途中参加：同じ名前のCPUの席があればそこ、なければ空いているCPUの席からランダム
function pickSeat(name) {
  const g = UI.game, sp = UI.series.players;
  const free = sp.map((p, s) => s).filter(s => s > 0 && !sp[s].isHuman && !g.players[s].finished);
  if (!free.length) return null;
  const same = free.find(s => sp[s].seatName === name);
  return same !== undefined ? same : free[Math.floor(Math.random() * free.length)];
}
function seatTake(seat, name) {
  const sp = UI.series.players[seat];
  sp.isHuman = true; sp.name = name;
  const gp = UI.game && UI.game.players[seat];
  if (gp) { gp.isHuman = true; gp.name = name; }
}
function seatRevert(seat) {
  const sp = UI.series.players[seat];
  sp.isHuman = false; sp.name = sp.seatName; if (!sp.level) sp.level = '普通';
  const gp = UI.game && UI.game.players[seat];
  if (gp) { gp.isHuman = false; gp.name = sp.name; gp.level = sp.level; }
}
function netDrop(peer) {
  if (!UI.net || peer.dropped) return;
  peer.dropped = true;
  try { peer.dc.close(); } catch (e) {}
  try { peer.pc.close(); } catch (e) {}
  UI.net.peers = UI.net.peers.filter(p => p !== peer);
  if (peer.seat !== null && UI.series && UI.game) {
    seatRevert(peer.seat);
    addMsg(`${peer.name}さんが切断しました。CPUが代わります`);
    toast(`${peer.name}さんの接続が切れました。CPUが代わります`);
    runFlow();
  } else refreshLobby();
}
// ホスト：生存の合図（ping）が8秒以上届かない参加者は切断とみなす（ブラウザを閉じても検出できるように）
function startHostWatch() {
  clearInterval(UI.net.timer);
  UI.net.timer = setInterval(() => {
    if (!isHost()) return;
    hostPeers().slice().forEach(p => { if (p.seen && Date.now() - p.seen > 8000) netDrop(p); });
  }, 2000);
}
function netSeriesEnded() {
  if (!isHost()) return;
  hostPeers().forEach(p => { if (p.seat !== null) { p.seat = null; netSend(p.dc, { t: 'lobby' }); } });
}
// ゲストに渡す状態。他人の手札は枚数だけにする（交換で受け取る側には渡す側の手札を見せる）
function maskFor(g, seat) {
  const ex = g.phase === 'exchange' ? Logic.pendingExchange(g) : null;
  const players = g.players.map(p => {
    const reveal = p.id === seat || (!!ex && ex.stage === 'give' && p.id === ex.giver && seat === ex.receiver);
    const hand = reveal ? p.hand : p.hand.map((c, k) => ({ id: -1000 - p.id * 100 - k, suit: 'X', num: 0 }));
    return { ...p, hand };
  });
  return JSON.parse(JSON.stringify({ ...g, players }));
}
function netBroadcast() {
  if (!isHost() || !UI.game || !UI.series) return;
  const series = {
    players: UI.series.players.map(p => ({ name: p.name, isHuman: p.isHuman, level: p.level, record: p.record, role: p.role })),
    rules: UI.series.rules, gameCount: UI.series.gameCount,
  };
  hostPeers().forEach(p => {
    if (p.seat !== null) netSend(p.dc, { t: 'state', seat: p.seat, game: maskFor(UI.game, p.seat), series, msgs: UI.messages, fx: { seq: UI.fxSeq, events: UI.fxEvents } });
  });
}

/* ---------- ゲスト側 ---------- */
async function guestAnswer(offerCode, name) {
  const pc = newPC();
  UI.net = { role: 'guest', pc, dc: null, name };
  pc.ondatachannel = e => {
    UI.net.dc = e.channel;
    e.channel.onopen = () => {
      netSend(e.channel, { t: 'hello', name });
      UI.net.ping = setInterval(() => netSend(e.channel, { t: 'ping' }), 2000);
      window.addEventListener('pagehide', () => netSend(e.channel, { t: 'bye' }));
    };
    e.channel.onmessage = ev => guestMessage(JSON.parse(ev.data));
    e.channel.onclose = () => guestDrop();
  };
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) guestDrop(); };
  await pc.setRemoteDescription(decodeCode(offerCode));
  await pc.setLocalDescription(await pc.createAnswer());
  await waitIce(pc);
  return encodeCode(pc.localDescription);
}
function guestMessage(m) {
  if (m.t === 'welcome') {
    UI.myId = m.seat;
    if (m.seat < 0) { UI.game = null; UI.screen = 'guestlobby'; render(); }
  } else if (m.t === 'state') guestApply(m);
  else if (m.t === 'lobby') { UI.game = null; closeOverlay(); UI.screen = 'guestlobby'; render(); }
  else if (m.t === 'end') { toast('ホストが部屋を閉じました'); guestLeave(); }
  else if (m.t === 'full') { toast('部屋が満員です'); guestLeave(); }
  else if (m.t === 'err') { toast(m.msg); if (UI.game) guestOverlays(UI.game); }
}
function guestApply(m) {
  const first = UI.screen !== 'game';
  const prev = UI.game;
  UI.myId = m.seat;
  UI.series = m.series;
  UI.messages = m.msgs || [];
  const changed = !prev || prev.turn !== m.game.turn || prev.playId !== m.game.playId || prev.phase !== m.game.phase;
  UI.game = m.game;
  const fxNew = !!m.fx && m.fx.seq !== UI.fxSeen;
  if (m.fx) UI.fxSeen = m.fx.seq;
  if (changed) UI.selected.clear();
  if (!UI.inGame) { history.pushState({ game: true }, ''); UI.inGame = true; }
  UI.screen = 'game';
  if (first) {
    Sound.deal(m.game.players[UI.myId].hand.length);
    render();
  } else {
    renderAll();
  }
  if (!first && fxNew) playFx(m.game, m.fx.events || []);
  if (m.game.over) { if (UI.overlay !== 'result') openResult(); return; }
  if (UI.overlay === 'result') closeOverlay();
  guestOverlays(m.game);
}
// 自分の番の操作画面（7渡し・交換）を、状態に合わせて開く・閉じる
function guestOverlays(g) {
  const me = UI.myId;
  if (g.phase === 'seven' && g.pendingSeven.from === me) {
    const key = `${g.playId}-${g.pendingSeven.remaining}`;
    if (UI.overlay !== 'seven' || UI.sevKey !== key) { UI.sevKey = key; openSeven(); }
  } else if (UI.overlay === 'seven') closeOverlay();
  if (g.phase === 'discard' && g.pendingDiscard.from === me) {
    const key = `${g.playId}-${g.pendingDiscard.remaining}`;
    if (UI.overlay !== 'discard' || UI.disKey !== key) { UI.disKey = key; openDiscard(); }
  } else if (UI.overlay === 'discard') closeOverlay();
  const ex = g.phase === 'exchange' ? Logic.pendingExchange(g) : null;
  let mode = null;
  if (ex && ex.receiver === me) mode = ex.stage === 'give' ? (g.rules.exchangeChoose ? 'take' : null) : 'return';
  if (mode) {
    const key = `${mode}-${ex.stage}-${ex.count}-${ex.giver}-${ex.receiver}`;
    if (UI.overlay !== 'exchange' || UI.exKey !== key) { UI.exKey = key; openExchange(ex, mode); }
  } else if (UI.overlay === 'exchange') closeOverlay();
}
function guestDrop() {
  if (!UI.net || UI.net.role !== 'guest') return;
  toast('ホストとの接続が切れました');
  guestLeave();
}
function guestLeave() {
  netLeave();
  UI.game = null; UI.series = null; UI.myId = 0;
  UI.screen = 'title'; closeOverlay(); render();
}

/* ---------- 共通 ---------- */
// 操作の提出：ゲストは送信、ホストは自分の座席として直接処理する
function submit(a) {
  if (isGuest()) { netSend(UI.net.dc, { t: 'act', a }); UI.selected.clear(); return; }
  applyAct(UI.myId, a);
}
// 座席 seat の操作を処理する（ホストだけが行う）。遠隔の座席の不正な操作はその人にだけ伝える。
function applyAct(seat, a) {
  const g = UI.game;
  if (!g || g.over) return;
  const local = seat === UI.myId;
  const fail = reason => { if (local) { toast(reason); runFlow(); } else netSeat(seat, { t: 'err', msg: reason }); };
  if (a.k === 'play') {
    if (g.phase !== 'play' || g.turn !== seat) return fail('あなたの番ではありません');
    const cards = g.players[seat].hand.filter(c => a.ids.includes(c.id));
    const res = Logic.applyPlay(g, seat, cards, a.mode || 'normal');
    if (!res.ok) return fail(res.reason);
    if (local) UI.selected.clear();
    afterAction(g, res.events);
  } else if (a.k === 'pass') {
    if (g.phase !== 'play' || g.turn !== seat) return fail('あなたの番ではありません');
    const res = Logic.applyPass(g, seat);
    if (!res.ok) return fail(res.reason);
    if (local) UI.selected.clear();
    afterAction(g, res.events);
  } else if (a.k === 'seven') {
    if (g.phase !== 'seven' || g.pendingSeven.from !== seat) return fail('7渡しの番ではありません');
    const res = Logic.giveSevenCards(g, a.ids);
    if (!res.ok) return fail(res.reason);
    if (local) closeOverlay();
    afterAction(g, res.events);
  } else if (a.k === 'discard') {
    if (g.phase !== 'discard' || g.pendingDiscard.from !== seat) return fail('捨て札の番ではありません');
    const res = Logic.discardCards(g, seat, a.ids);
    if (!res.ok) return fail(res.reason);
    if (local) closeOverlay();
    afterAction(g, res.events);
  } else if (a.k === 'ex') {
    const ex = Logic.pendingExchange(g);
    if (!ex || ex.receiver !== seat) return fail('交換の番ではありません');
    const wasGive = ex.stage === 'give';
    const src = wasGive ? g.players[ex.giver] : g.players[ex.receiver];
    const cards = src.hand.filter(c => a.ids.includes(c.id));
    const res = wasGive ? Logic.exchangeGive(g, ex, cards) : Logic.exchangeReturn(g, ex, cards);
    if (!res.ok) return fail(res.reason);
    Sound.slide(cards.length);
    addMsg(wasGive
      ? `${g.players[ex.receiver].name}が${g.players[ex.giver].name}から札を受け取りました`
      : `${g.players[ex.receiver].name}が${g.players[ex.giver].name}に札を返しました`);
    if (local) closeOverlay();
    runFlow();
  }
}
function netLeave() {
  const n = UI.net;
  if (!n) return;
  clearInterval(n.ping); clearInterval(n.timer);
  UI.net = null;
  if (n.role === 'host') {
    n.peers.forEach(p => { netSend(p.dc, { t: 'end' }); try { p.dc.close(); } catch (e) {} try { p.pc.close(); } catch (e) {} });
  } else {
    try { if (n.dc) n.dc.close(); } catch (e) {}
    try { n.pc.close(); } catch (e) {}
  }
}


function hostPanelHTML() {
  const rows = namedPeers().map(p => `<div class="cpu-row"><span>${esc(p.name)}</span><span class="small">参加中</span></div>`).join('');
  return `<div class="form" style="padding-bottom:0">
    <div class="lbl">参加者（あなたを含む）</div>
    <div class="cpu-row"><span>${esc(UI.draft.name || 'あなた')}（ホスト）</span><span class="small">人間</span></div>
    ${rows}
    <button class="btn" data-act="invite">参加者を追加（コードを発行）</button>
    <p class="small">空いた人数はCPUになります。合計は3〜8人です。途中参加は、CPUと同じ名前で入ると、その席に入れます。同じ名前のCPUがいなければ、空いているCPUの席のどれかに入ります。</p>
  </div>`;
}
function mpHTML() {
  return `<div class="bar"><button class="btn small ghost" data-act="toTitle">← 戻る</button><h1>みんなで遊ぶ</h1><span></span></div>
  <div class="form">
    <p class="small">同じWi-Fi（同じネットワーク）の端末同士で遊べます。サーバーは使わず、接続コードをコピーして相手に送ります。</p>
    <button class="btn big" data-act="hostRoom">部屋を作る（ホスト）</button>
    <button class="btn big" data-act="guestRoom">部屋に参加する（ゲスト）</button>
  </div>`;
}
function guestJoinHTML() {
  const g = UI.guest;
  const body = g.answer
    ? `<p>③ この「返答コード」を、ホストの画面に貼り付けてもらってください（コピーして送る）。</p>
       <textarea id="answerOut" class="txt code" readonly>${g.answer}</textarea>
       <div class="row"><button class="btn" data-act="copyAnswer">返答コードをコピー</button></div>
       <p class="small">ホストが接続すると、ホストの開始を待つ画面に変わります。</p>`
    : `<label class="lbl">あなたの名前（任意）<input id="nameG" class="txt" maxlength="10" placeholder="あなた"></label>
       <label class="lbl">① ホストから受け取った「参加コード」を貼り付け<textarea id="offerIn" class="txt code" placeholder="参加コードを貼り付け"></textarea></label>
       <button class="btn big" data-act="makeAnswer">② 返答コードを作る</button>
       <p class="small">途中参加の場合は、入りたいCPUと同じ名前にすると、その席に入れます（同じ名前のCPUがいなければ、空いているCPUの席のどれかに入ります）。</p>`;
  return `<div class="bar"><button class="btn small ghost" data-act="toTitle">← 戻る</button><h1>部屋に参加</h1><span></span></div>
    <div class="form">${body}</div>`;
}
function guestLobbyHTML() {
  return `<div class="bar"><button class="btn small ghost" data-act="toTitle">やめる</button><h1>部屋</h1><span></span></div>
    <div class="form"><p>接続しました。ホストがゲームを開始するまでお待ちください。</p></div>`;
}

/* ---------- イベント（委譲） ---------- */
// 確認画面。元の画面（交換・7渡しなど）は「もどる」で元どおり戻す
function askConfirm(message, label, fn) {
  UI.confirmBack = UI.overlay ? { kind: UI.overlay, html: $('#overlay').innerHTML } : null;
  UI.confirmFn = fn;
  openOverlay('confirm', `<div class="modal"><h2>確認</h2><p>${esc(message)}</p>
    <div class="row"><button class="btn" data-act="confirmNo">もどる</button>
    <button class="btn big" data-act="confirmYes">${label}</button></div></div>`);
}
function endSeriesNow() {
  clearTimeout(UI.timer);
  netSeriesEnded();
  UI.series = null; UI.game = null; UI.inGame = false;
  UI.screen = 'settings'; closeOverlay(); render();
}

const ACTIONS = {
  mp: () => { UI.screen = 'mp'; render(); },
  hostRoom: () => { UI.net = { role: 'host', peers: [] }; startHostWatch(); UI.screen = 'hostlobby'; render(); },
  guestRoom: () => { UI.net = null; UI.guest = { answer: null, name: '' }; UI.screen = 'guestjoin'; render(); },
  invite: () => openInvite(),
  closeInvite: () => closeInvite(),
  copyOffer: () => copyText($('#offerTa').value),
  connectAnswer: () => connectAnswer(),
  makeAnswer: async () => {
    const name = ($('#nameG').value.trim() || 'あなた').slice(0, 10);
    const code = $('#offerIn').value;
    try {
      const answer = await guestAnswer(code, name);
      UI.guest = { answer, name };
      render();
    } catch (e) { toast('参加コードが正しくありません'); netLeave(); }
  },
  copyAnswer: () => copyText($('#answerOut').value),
  newGame: () => { UI.screen = 'settings'; render(); },
  toTitle: () => { netLeave(); UI.screen = 'title'; render(); },
  rules: () => openRules(),
  cpu: b => { readSettingsDOM(); UI.draft.cpuCount = +b.dataset.n; render(); },
  start: () => startSeries(),
  play: () => humanPlay(),
  pass: () => humanPass(),
  sort: () => { UI.sortMode = UI.sortMode === 'num' ? 'suit' : 'num'; Sound.slide(2); renderHand(UI.game); renderButtons(UI.game); },
  hl: () => { UI.highlight = !UI.highlight; renderAll(); },
  snd: () => {
    Sound.toggle();
    if (UI.screen === 'game' && UI.game) renderButtons(UI.game);
    else { readSettingsDOM(); render(); }
  },
  mode: b => { UI.stairMode = b.dataset.m; renderStatus(UI.game); renderModeBar(UI.game); },
  quit: () => askConfirm('タイトルに戻ります。連続戦は終了します。', 'やめる', endAll),
  board: () => openBoard(),
  closeBoard: () => { if (UI.game && UI.game.over) openResult(); else closeOverlay(); },
  close: () => closeOverlay(),
  next: () => (isGuest() ? toast('次のゲームはホストが開始します') : startNewGame()),
  endSeries: () => (isGuest() ? toast('ホストだけが操作できます') : askConfirm('連続戦を終了します。記録は破棄されます。', '終了する', endSeriesNow)),
  confirmYes: () => { const f = UI.confirmFn; UI.confirmFn = null; UI.confirmBack = null; if (f) f(); },
  confirmNo: () => {
    UI.confirmFn = null;
    const back = UI.confirmBack; UI.confirmBack = null;
    if (back) openOverlay(back.kind, back.html); else closeOverlay();
  },
  // 7渡し
  sevOk: () => {
    const s = UI.game && UI.game.pendingSeven;
    if (!s || UI.seven.sel.size !== Logic.sevenNeed(UI.game)) return;
    const ids = [...UI.seven.sel];
    UI.seven = { sel: new Set() };
    closeOverlay();
    submit({ k: 'seven', ids });
  },
  discOk: () => {
    if (!UI.game || !UI.game.pendingDiscard || UI.discSel.size !== Logic.discardNeed(UI.game, UI.game.pendingDiscard.from)) return;
    const ids = [...UI.discSel];
    closeOverlay();
    UI.discSel = new Set();
    submit({ k: 'discard', ids });
  },
  // 大富豪交換
  exNext: () => {
    if (UI.exSel.size !== UI.exchange.count) return;
    UI.exStep = 'confirm';
    renderExchange();
  },
  exBack: () => { UI.exStep = 'select'; renderExchange(); },
  exFinal: () => {
    const ids = [...UI.exSel];
    closeOverlay();
    UI.exSel = new Set(); UI.exStep = 'select';
    submit({ k: 'ex', ids });
  },
};

document.addEventListener('click', e => {
  Sound.unlock();
  const card = e.target.closest('.card[data-cid]');
  if (card) {
    const id = +card.dataset.cid;
    if (UI.overlay === 'exchange' && UI.exStep !== 'confirm' && card.closest('#exHand')) exToggle(id);
    else if (UI.overlay === 'seven' && card.closest('#exHand')) sevToggle(id);
    else if (UI.overlay === 'discard' && card.closest('#exHand')) discToggle(id);
    else if (UI.screen === 'game' && card.closest('#hand')) toggleCard(id);
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const fn = ACTIONS[btn.dataset.act];
  if (fn) fn(btn);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-theme-pick]')) { setTheme(t.value); return; }
  if ((UI.screen === 'settings' || UI.screen === 'hostlobby') && (t.matches('[data-rule]') || t.matches('[data-draft]') || t.id === 'hlIn' || t.id === 'sndIn')) {
    readSettingsDOM();
    render();
  }
});
window.addEventListener('popstate', () => {
  if (UI.screen === 'game' && UI.game) {
    history.pushState({ game: true }, '');
    toast('ゲーム中は戻れません。「やめる」からタイトルへ戻れます');
  }
});

setTheme(UI.theme);
render();

</script>
</body>
</html>
